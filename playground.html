<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Laua Playground</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: Inter, system-ui, Arial, sans-serif; background: #0f1115; color: #f4f4f5; }
    body { display: flex; flex-direction: column; }
    header {
      height: 58px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px; border-bottom: 1px solid #2a2f3a; background: #151922;
    }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand h1 { margin: 0; font-size: 20px; }
    .brand span { color: #9aa4b2; font-size: 13px; }
    .actions { display: flex; gap: 8px; }
    button {
      border: 1px solid #343b49; border-radius: 8px; background: #232936; color: #f4f4f5;
      padding: 8px 13px; cursor: pointer; font-weight: 600;
    }
    button:hover { background: #2b3342; }
    #transpileBtn { background: #2563eb; border-color: #2563eb; }
    #transpileBtn:hover { background: #1d4ed8; }
    main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
    .pane { min-width: 0; display: flex; flex-direction: column; }
    .pane:first-child { border-right: 1px solid #2a2f3a; }
    .pane-title {
      height: 38px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; background: #151922; border-bottom: 1px solid #2a2f3a;
      color: #cbd5e1; font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    }
    .editor { flex: 1; min-height: 0; }
    #status {
      height: 30px; display: flex; align-items: center; padding: 0 12px;
      border-top: 1px solid #2a2f3a; background: #151922; color: #94a3b8; font-size: 12px;
    }
    .ok { color: #86efac !important; }
    .error { color: #fca5a5 !important; }
    @media (max-width: 850px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
      .pane:first-child { border-right: 0; border-bottom: 1px solid #2a2f3a; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Laua Playground</h1>
      <span>pronounced “Lawah”</span>
    </div>
    <div class="actions">
      <button id="exampleBtn">Example</button>
      <button id="clearBtn">Clear</button>
      <button id="transpileBtn">Transpile</button>
    </div>
  </header>

  <main>
    <section class="pane">
      <div class="pane-title"><span>Laua</span><span>Ctrl + Enter to transpile</span></div>
      <div id="lauaEditor" class="editor"></div>
    </section>

    <section class="pane">
      <div class="pane-title"><span>Luau Output</span><span>read only</span></div>
      <div id="luauEditor" class="editor"></div>
    </section>
  </main>

  <div id="status">Ready.</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
  <script>
    const LAUA_KEYWORDS = [
      "class", "extends", "constructor", "private", "public", "protected",
      "static", "new", "namespace", "super", "abstract", "override", "enum"
    ];

    const LUAU_KEYWORDS = [
      "and", "break", "continue", "do", "else", "elseif", "end", "export",
      "false", "for", "function", "if", "in", "local", "nil", "not", "or",
      "repeat", "return", "then", "true", "type", "until", "while"
    ];

    const LUAU_GLOBALS = [
      "assert", "error", "getfenv", "getmetatable", "ipairs", "loadstring",
      "newproxy", "next", "pairs", "pcall", "print", "rawequal", "rawget",
      "rawlen", "rawset", "select", "setfenv", "setmetatable", "tonumber",
      "tostring", "type", "typeof", "unpack", "xpcall", "_G", "_VERSION",
      "shared", "game", "workspace", "script", "Enum", "Instance", "CFrame",
      "Vector2", "Vector3", "UDim", "UDim2", "Color3", "BrickColor",
      "NumberRange", "NumberSequence", "ColorSequence", "Rect", "Ray",
      "Region3", "PhysicalProperties", "Random", "DateTime", "TweenInfo",
      "OverlapParams", "RaycastParams", "Axes", "Faces", "Font"
    ];

    const ROBLOX_SERVICES = [
      "Players", "RunService", "UserInputService", "ContextActionService",
      "ReplicatedStorage", "ServerStorage", "ServerScriptService",
      "StarterGui", "StarterPlayer", "TweenService", "CollectionService",
      "HttpService", "DataStoreService", "MemoryStoreService", "MessagingService",
      "TeleportService", "PathfindingService", "PhysicsService", "Debris",
      "MarketplaceService", "BadgeService", "LocalizationService", "Lighting",
      "SoundService", "TextService", "GuiService", "Teams", "Chat",
      "AssetService", "InsertService", "ProximityPromptService"
    ];

    const LIBRARY_MEMBERS = {
      math: [
        "abs", "acos", "asin", "atan", "atan2", "ceil", "clamp", "cos",
        "cosh", "deg", "exp", "floor", "fmod", "frexp", "ldexp", "log",
        "log10", "max", "min", "modf", "noise", "pow", "rad", "random",
        "randomseed", "round", "sign", "sin", "sinh", "sqrt", "tan", "tanh",
        "huge", "pi"
      ],
      table: [
        "clear", "clone", "concat", "create", "find", "freeze", "insert",
        "isfrozen", "maxn", "move", "pack", "remove", "sort", "unpack"
      ],
      string: [
        "byte", "char", "find", "format", "gmatch", "gsub", "len", "lower",
        "match", "pack", "packsize", "rep", "reverse", "split", "sub",
        "unpack", "upper"
      ],
      task: [
        "cancel", "defer", "delay", "desynchronize", "spawn", "synchronize", "wait"
      ],
      coroutine: [
        "close", "create", "isyieldable", "resume", "running", "status", "wrap", "yield"
      ],
      utf8: [
        "char", "charpattern", "codes", "codepoint", "graphemes", "len", "nfcnormalize", "nfdnormalize", "offset"
      ],
      os: ["clock", "date", "difftime", "time"],
      bit32: [
        "arshift", "band", "bnot", "bor", "btest", "bxor", "countlz",
        "countrz", "extract", "lrotate", "lshift", "replace", "rrotate", "rshift"
      ],
      buffer: [
        "copy", "create", "fill", "fromstring", "len", "readf32", "readf64",
        "readi8", "readi16", "readi32", "readstring", "readu8", "readu16",
        "readu32", "tostring", "writef32", "writef64", "writei8", "writei16",
        "writei32", "writestring", "writeu8", "writeu16", "writeu32"
      ]
    };

    const STARTER = `-- Laua playground

enum SchedulerPriority
    First = 100
    High = 75
    Normal = 50
    Low = 25
    Last = 0
end

namespace Scheduler
    local tasks = {}

    local function countTasks()
        local amount = 0

        for _ in tasks do
            amount += 1
        end

        return amount
    end

    function Bind(name, callback, priority)
        tasks[name] = {
            priority or SchedulerPriority.Normal,
            callback
        }

        print("Bound", name, countTasks())
    end
end

class Entity
    constructor(name)
        self.Name = name
    end

    public function GetName()
        return self.Name
    end
end

class Zombie extends Entity
    private Health = 100

    constructor(name, health)
        super(name)
        self.Health = health
    end

    override function GetName()
        return "Zombie: " .. super:GetName()
    end
end

local zombie = new Zombie("Walker", 150)
print(zombie:GetName())
`;

    function replaceRange(source, start, end, replacement) {
      return source.slice(0, start) + replacement + source.slice(end);
    }

    function normalizeBlockIndent(source, indent = "    ") {
      const lines = source.replace(/\r\n/g, "\n").split("\n");

      while (lines.length > 0 && lines[0].trim() === "") lines.shift();
      while (lines.length > 0 && lines[lines.length - 1].trim() === "") lines.pop();

      if (lines.length === 0) return "";

      let smallestIndent = Infinity;

      for (const line of lines) {
        if (line.trim() === "") continue;

        const leading = line.match(/^[\t ]*/)?.[0].length || 0;
        if (leading < smallestIndent) smallestIndent = leading;
      }

      if (!Number.isFinite(smallestIndent)) smallestIndent = 0;

      return lines.map(line => {
        if (line.trim() === "") return "";
        return indent + line.slice(smallestIndent);
      }).join("\n");
    }

    function isIdent(ch) {
      return !!ch && /[A-Za-z0-9_]/.test(ch);
    }

    function maskNonCode(source) {
      const out = source.split("");
      let i = 0;
      let quote = null;
      let lineComment = false;
      let blockComment = false;

      while (i < source.length) {
        const one = source[i];
        const two = source.slice(i, i + 2);
        const four = source.slice(i, i + 4);

        if (quote) {
          if (one === "\\") {
            out[i] = " ";
            if (i + 1 < out.length) out[i + 1] = " ";
            i += 2;
            continue;
          }
          if (one === quote) quote = null;
          if (one !== "\n") out[i] = " ";
          i++;
          continue;
        }

        if (lineComment) {
          if (one === "\n") {
            lineComment = false;
          } else {
            out[i] = " ";
          }
          i++;
          continue;
        }

        if (blockComment) {
          if (two === "]]") {
            out[i] = " ";
            if (i + 1 < out.length) out[i + 1] = " ";
            blockComment = false;
            i += 2;
            continue;
          }
          if (one !== "\n") out[i] = " ";
          i++;
          continue;
        }

        if (four === "--[[") {
          for (let j = 0; j < 4; j++) if (i + j < out.length) out[i + j] = " ";
          blockComment = true;
          i += 4;
          continue;
        }

        if (two === "--") {
          out[i] = " ";
          if (i + 1 < out.length) out[i + 1] = " ";
          lineComment = true;
          i += 2;
          continue;
        }

        if (one === '"' || one === "'") {
          quote = one;
          out[i] = " ";
          i++;
          continue;
        }

        i++;
      }

      return out.join("");
    }

    function findKeyword(masked, keyword, from = 0) {
      let i = from;

      while ((i = masked.indexOf(keyword, i)) !== -1) {
        const before = masked[i - 1] || "";
        const after = masked[i + keyword.length] || "";

        const validBefore =
          !isIdent(before) &&
          before !== "." &&
          before !== ":";

        const validAfter = !isIdent(after);

        if (validBefore && validAfter) return i;

        i += keyword.length;
      }

      return -1;
    }

    function findMatchingParen(source, openIndex) {
      const masked = maskNonCode(source);
      let depth = 0;
      for (let i = openIndex; i < source.length; i++) {
        if (masked[i] === "(") depth++;
        if (masked[i] === ")") {
          depth--;
          if (depth === 0) return i;
        }
      }
      throw new Error("Expected ')'");
    }

    function splitLinesWithOffsets(source) {
      const lines = [];
      let start = 0;
      for (let i = 0; i <= source.length; i++) {
        if (i === source.length || source[i] === "\n") {
          lines.push({ start, end: i, text: source.slice(start, i) });
          start = i + 1;
        }
      }
      return lines;
    }

    function findMatchingEndByLines(source, startIndex) {
      const lines = splitLinesWithOffsets(source);
      const startLine = lines.findIndex(line => startIndex >= line.start && startIndex <= line.end);
      let depth = 0;

      for (let li = startLine; li < lines.length; li++) {
        const raw = lines[li].text;
        const maskedLine = maskNonCode(raw).trim();
        if (!maskedLine) continue;

        const opens =
          /^(abstract\s+)?class\b/.test(maskedLine) ||
          /^namespace\b/.test(maskedLine) ||
          /^enum\b/.test(maskedLine) ||
          /^constructor\s*\(/.test(maskedLine) ||
          /^(public|private|protected|static|override|abstract|\s)*\s*function\b/.test(maskedLine) ||
          /^function\b/.test(maskedLine) ||
          /^local\s+function\b/.test(maskedLine) ||
          /^if\b.*\bthen\s*$/.test(maskedLine) ||
          /^for\b.*\bdo\s*$/.test(maskedLine) ||
          /^while\b.*\bdo\s*$/.test(maskedLine) ||
          /^do\s*$/.test(maskedLine) ||
          /^repeat\s*$/.test(maskedLine);

        if (opens) depth++;

        if (/^until\b/.test(maskedLine)) {
          depth--;
          if (depth === 0) return { start: lines[li].start, end: lines[li].end };
        }

        if (/^end\b/.test(maskedLine)) {
          depth--;
          if (depth === 0) return { start: lines[li].start, end: lines[li].end };
        }
      }

      throw new Error("Expected 'end'");
    }

    function transpileNew(source) {
      while (true) {
        const masked = maskNonCode(source);
        const idx = findKeyword(masked, "new");
        if (idx === -1) break;

        let i = idx + 3;
        while (/\s/.test(source[i] || "")) i++;

        const start = i;
        while (/[A-Za-z0-9_.]/.test(source[i] || "")) i++;
        const name = source.slice(start, i);

        if (!name) throw new Error("Expected class name after 'new'");

        let p = i;
        while (/\s/.test(source[p] || "")) p++;

        if (source[p] === "(") {
          source = source.slice(0, idx) + name + ".new" + source.slice(i);
        } else {
          source = source.slice(0, idx) + name + ".new()" + source.slice(i);
        }
      }

      return source;
    }

    function transpileEnum(source) {
      while (true) {
        const masked = maskNonCode(source);
        const idx = findKeyword(masked, "enum");
        if (idx === -1) break;

        const headerEnd = source.indexOf("\n", idx);
        if (headerEnd === -1) throw new Error("Enum body expected");

        const header = source.slice(idx, headerEnd).trim();
        const m = header.match(/^enum\s+([A-Za-z_][A-Za-z0-9_]*)$/);
        if (!m) throw new Error("Invalid enum declaration");

        const name = m[1];
        const endPos = findMatchingEndByLines(source, idx);
        const body = source.slice(headerEnd + 1, endPos.start);
        const members = [];
        let auto = 0;

        for (const raw of body.split("\n")) {
          let line = raw.trim().replace(/,$/, "");
          if (!line || line.startsWith("--")) continue;

          let mm = line.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+)$/);
          if (mm) {
            members.push(`    ${mm[1]} = ${mm[2]},`);
          } else {
            mm = line.match(/^([A-Za-z_][A-Za-z0-9_]*)$/);
            if (!mm) throw new Error(`Invalid enum member: ${line}`);
            members.push(`    ${mm[1]} = ${auto},`);
            auto++;
          }
        }

        const result = `local ${name} = table.freeze({\n${members.join("\n")}\n})`;
        source = source.slice(0, idx) + result + source.slice(endPos.end);
      }

      return source;
    }

    function transpileNamespace(source) {
      while (true) {
        const masked = maskNonCode(source);
        const idx = findKeyword(masked, "namespace");
        if (idx === -1) break;

        const headerEnd = source.indexOf("\n", idx);
        if (headerEnd === -1) throw new Error("Namespace body expected");

        const lineStart = source.lastIndexOf("\n", idx - 1) + 1;
        const before = source.slice(lineStart, idx).trim();
        const returned = before === "return";

        if (before && !returned) {
          throw new Error("namespace can only be standalone or directly returned");
        }

        const header = source.slice(idx, headerEnd).trim();
        const m = header.match(/^namespace\s+([A-Za-z_][A-Za-z0-9_]*)$/);
        if (!m) throw new Error("Invalid namespace declaration");

        const name = m[1];
        const endPos = findMatchingEndByLines(source, idx);
        let body = source.slice(headerEnd + 1, endPos.start);

        const lines = body.split("\n");
        let depth = 0;

        body = lines.map(line => {
          const trimmed = line.trim();
          const indent = line.match(/^\s*/)[0];

          if (depth === 0) {
            const fn = trimmed.match(/^function\s+([A-Za-z_][A-Za-z0-9_]*)\s*\((.*)\)\s*$/);
            if (fn) {
              depth++;
              return `${indent}function ${name}.${fn[1]}(${fn[2]})`;
            }

            const localFn = /^local\s+function\b/.test(trimmed);
            if (localFn) {
              depth++;
              return line;
            }

            const field = trimmed.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+)$/);
            if (field && !/^local\b/.test(trimmed)) {
              return `${indent}${name}.${field[1]} = ${field[2]}`;
            }
          }

          if (/^(function|local\s+function|if|for|while|do|repeat)\b/.test(trimmed) && depth > 0) depth++;
          if (/^end\b/.test(trimmed) && depth > 0) depth--;
          if (/^until\b/.test(trimmed) && depth > 0) depth--;

          return line;
        }).join("\n");

        body = transpileCore(body);
        body = normalizeBlockIndent(body, "    ");

        const generated = `(function()\n    local ${name} = {}\n${body}${body ? "\n" : ""}    return ${name}\nend)()`;

        if (returned) {
          source = source.slice(0, idx) + generated + source.slice(endPos.end);
        } else {
          source = source.slice(0, idx) + `local ${name} = ${generated}` + source.slice(endPos.end);
        }
      }

      return source;
    }

    function transpileClass(source) {
      while (true) {
        let masked = maskNonCode(source);
        let classIdx = findKeyword(masked, "class");
        if (classIdx === -1) break;

        const lineStart = source.lastIndexOf("\n", classIdx - 1) + 1;
        const prefix = source.slice(lineStart, classIdx).trim();
        const isAbstract = prefix === "abstract";
        const declStart = isAbstract ? lineStart + source.slice(lineStart, classIdx).indexOf("abstract") : classIdx;

        const headerEnd = source.indexOf("\n", classIdx);
        if (headerEnd === -1) throw new Error("Class body expected");

        const header = source.slice(classIdx, headerEnd).trim();
        const hm = header.match(/^class\s+([A-Za-z_][A-Za-z0-9_]*)(?:\s+extends\s+([A-Za-z_][A-Za-z0-9_.]*))?$/);
        if (!hm) throw new Error("Invalid class declaration");

        const name = hm[1];
        const base = hm[2] || null;
        const endPos = findMatchingEndByLines(source, classIdx);
        const body = source.slice(headerEnd + 1, endPos.start);

        const fields = [];
        const statics = [];
        const methods = [];
        let constructor = null;

        const lines = splitLinesWithOffsets(body);
        let li = 0;

        while (li < lines.length) {
          const raw = lines[li].text;
          let t = raw.trim();
          if (!t || t.startsWith("--")) { li++; continue; }

          const ctor = t.match(/^constructor\s*\((.*)\)\s*$/);
          if (ctor) {
            const localStart = lines[li].start + raw.indexOf("constructor");
            const memberEnd = findMatchingEndByLines(body, localStart);
            const bodyStart = body.indexOf("\n", localStart) + 1;
            constructor = { params: ctor[1], body: body.slice(bodyStart, memberEnd.start) };
            li = lines.findIndex(x => x.start > memberEnd.end);
            if (li === -1) break;
            continue;
          }

          let isStatic = false, isOverride = false, isAbstractMethod = false;
          t = t.replace(/^(public|private|protected)\s+/, "");
          if (/^static\s+/.test(t)) { isStatic = true; t = t.replace(/^static\s+/, ""); }
          if (/^override\s+/.test(t)) { isOverride = true; t = t.replace(/^override\s+/, ""); }
          if (/^abstract\s+/.test(t)) { isAbstractMethod = true; t = t.replace(/^abstract\s+/, ""); }

          const fn = t.match(/^function\s+([A-Za-z_][A-Za-z0-9_]*)\s*\((.*)\)\s*$/);
          if (fn) {
            const functionOffset = raw.indexOf("function");
            const localStart = lines[li].start + functionOffset;
            const memberEnd = findMatchingEndByLines(body, localStart);
            const bodyStart = body.indexOf("\n", localStart) + 1;
            methods.push({
              name: fn[1],
              params: fn[2],
              body: body.slice(bodyStart, memberEnd.start),
              static: isStatic,
              override: isOverride,
              abstract: isAbstractMethod
            });
            li = lines.findIndex(x => x.start > memberEnd.end);
            if (li === -1) break;
            continue;
          }

          const field = t.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+)$/);
          if (field) {
            (isStatic ? statics : fields).push({ name: field[1], value: field[2] });
            li++;
            continue;
          }

          li++;
        }

        let out = `local ${name} = {}\n${name}.__index = ${name}\n`;
        if (base) out += `setmetatable(${name}, {__index = ${base}})\n`;
        out += `${name}.__abstract = ${isAbstract ? "true" : "false"}\n`;

        for (const f of statics) out += `${name}.${f.name} = ${transpileCore(f.value)}\n`;

        out += `\nfunction ${name}.__init(self, ...)\n`;
        if (base) out += `    ${base}.__init(self, ...)\n`;
        for (const f of fields) out += `    self.${f.name} = ${transpileCore(f.value)}\n`;

        if (constructor) {
          let cb = constructor.body;
          if (base) {
            cb = cb.replace(/\bsuper\s*\(/g, `${base}.__init(self, `);
            cb = cb.replace(/\bsuper:([A-Za-z_][A-Za-z0-9_]*)\s*\(/g, `${base}.$1(self, `);
          }

          cb = transpileCore(cb);
          cb = normalizeBlockIndent(cb, "    ");

          if (cb) out += cb + "\n";
        }
        out += "end\n";

        out += `\nfunction ${name}.new(...)\n`;
        out += `    if ${name}.__abstract then error("Cannot instantiate abstract class '${name}'") end\n`;
        out += `    local self = setmetatable({}, ${name})\n`;
        out += `    ${name}.__init(self, ...)\n`;
        out += `    return self\n`;
        out += "end\n";

        for (const method of methods) {
          out += "\n";
          if (method.abstract) {
            out += `function ${name}:${method.name}(${method.params})\n`;
            out += `    error("Abstract method '${name}.${method.name}' must be overridden")\n`;
            out += "end\n";
            continue;
          }

          let mb = method.body;
          if (base) {
            mb = mb.replace(/\bsuper:([A-Za-z_][A-Za-z0-9_]*)\s*\(/g, `${base}.$1(self, `);
            mb = mb.replace(/\bsuper\.([A-Za-z_][A-Za-z0-9_]*)/g, `${base}.$1`);
          }
          mb = transpileCore(mb);
          mb = normalizeBlockIndent(mb, "    ");

          out += method.static
            ? `function ${name}.${method.name}(${method.params})\n`
            : `function ${name}:${method.name}(${method.params})\n`;

          if (mb) out += mb + "\n";
          out += "end\n";
        }

        source = source.slice(0, declStart) + out + source.slice(endPos.end);
      }

      return source;
    }

    function transpileCore(source) {
      source = transpileEnum(source);
      source = transpileNamespace(source);
      source = transpileClass(source);
      source = transpileNew(source);
      return source;
    }

    function transpile(source) {
      const output = transpileCore(source);

      return output
        .split("\n")

              snippet("constructor", "constructor(${1})\n\t$0\nend", "Laua class member", "Create the class constructor."),
              snippet("public function", "public function ${1:Name}(${2})\n\t$0\nend", "Laua class member", "Create a public instance method."),
              snippet("private field", "private ${1:Field} = ${2:value}", "Laua class member", "Create a private field."),
              snippet("static function", "static function ${1:Name}(${2})\n\t$0\nend", "Laua class member", "Create a static method.")
            );
          }

          return { suggestions };
        }
      });


      monaco.editor.defineTheme("laua-dark", {
        base: "vs-dark",
        inherit: true,
        rules: [
          { token: "keyword.laua", foreground: "C084FC", fontStyle: "bold" },
          { token: "keyword", foreground: "60A5FA" },
          { token: "type.identifier", foreground: "67E8F9", fontStyle: "bold" },
          { token: "type", foreground: "67E8F9" },
          { token: "function", foreground: "FDE68A" },
          { token: "number", foreground: "FDBA74" },
          { token: "number.hex", foreground: "FDBA74" },
          { token: "number.binary", foreground: "FDBA74" },
          { token: "number.float", foreground: "FDBA74" },
          { token: "string", foreground: "86EFAC" },
          { token: "string.escape", foreground: "F9A8D4" },
          { token: "comment", foreground: "64748B", fontStyle: "italic" },
          { token: "operator", foreground: "F8FAFC" },
          { token: "constant.language", foreground: "FB7185" }
        ],
        colors: {
          "editor.background": "#0f1115",
          "editorLineNumber.foreground": "#475569",
          "editorLineNumber.activeForeground": "#CBD5E1",
          "editorCursor.foreground": "#E2E8F0",
          "editor.selectionBackground": "#33415599",
          "editor.inactiveSelectionBackground": "#33415555",
          "editorIndentGuide.background1": "#202633",
          "editorIndentGuide.activeBackground1": "#475569",
          "editorBracketHighlight.foreground1": "#60A5FA",
          "editorBracketHighlight.foreground2": "#C084FC",
          "editorBracketHighlight.foreground3": "#34D399",
          "editorBracketHighlight.foreground4": "#FBBF24",
          "editorBracketHighlight.foreground5": "#FB7185",
          "editorSuggestWidget.background": "#151922",
          "editorSuggestWidget.border": "#334155",
          "editorHoverWidget.background": "#151922",
          "editorHoverWidget.border": "#334155"
        }
      });

      monaco.languages.registerHoverProvider("laua", {
        provideHover(model, position) {
          const wordInfo = model.getWordAtPosition(position);
          if (!wordInfo) return null;

          const word = wordInfo.word;
          const symbols = getLauaSymbols(model.getValue());
          const contents = [];

          if (LAUA_DOCS[word]) {
            contents.push({ value: `**Laua keyword \`${word}\`**` });
            contents.push({ value: LAUA_DOCS[word] });
          } else if (symbols.classes[word]) {
            const info = symbols.classes[word];
            contents.push({
              value: `**class \`${word}\`${info.base ? ` extends \`${info.base}\`` : ""}**`
            });

            const instanceCount = Object.keys(info.instanceMembers).length;
            const staticCount = Object.keys(info.staticMembers).length;
            contents.push({ value: `${instanceCount} instance member(s), ${staticCount} static member(s).` });
          } else if (symbols.namespaces[word]) {
            const count = Object.keys(symbols.namespaces[word].members).length;
            contents.push({ value: `**namespace \`${word}\`**` });
            contents.push({ value: `${count} exported member(s).` });
          } else if (symbols.enums[word]) {
            const members = Object.keys(symbols.enums[word].members);
            contents.push({ value: `**enum \`${word}\`**` });
            contents.push({ value: members.length ? members.map(x => `\`${x}\``).join(", ") : "No members." });
          } else if (symbols.locals[word]) {
            contents.push({ value: `**local \`${word}\`**` });
            contents.push({ value: symbols.locals[word].detail || "Local variable." });
          } else if (symbols.localFunctions[word]) {
            const fn = symbols.localFunctions[word];
            contents.push({ value: `**function \`${word}(${fn.params || ""})\`**` });
          } else if (symbols.parameters[word]) {
            contents.push({ value: `**parameter \`${word}\`**` });
            contents.push({ value: symbols.parameters[word].detail || "Function parameter." });
          }

          if (contents.length === 0) return null;

          return {
            range: new monaco.Range(
              position.lineNumber,
              wordInfo.startColumn,
              position.lineNumber,
              wordInfo.endColumn
            ),
            contents
          };
        }
      });

      monaco.languages.registerDocumentSymbolProvider("laua", {
        provideDocumentSymbols(model) {
          const symbols = getLauaSymbols(model.getValue());
          const result = [];

          const add = (name, kind, start, end, detail = "") => {
            result.push({
              name,
              detail,
              kind,
              range: makeRangeFromOffsets(model, start, end),
              selectionRange: makeRangeFromOffsets(model, start, Math.min(end, start + name.length + 16)),
              children: []
            });
          };

          for (const info of Object.values(symbols.classes)) {
            add(info.name, monaco.languages.SymbolKind.Class, info.start, info.end, info.base ? `extends ${info.base}` : "");
          }

          for (const info of Object.values(symbols.namespaces)) {
            add(info.name, monaco.languages.SymbolKind.Namespace, info.start, info.end);
          }

          for (const info of Object.values(symbols.enums)) {
            add(info.name, monaco.languages.SymbolKind.Enum, info.start, info.end);
          }

          return result;
        }
      });

      monaco.languages.registerSignatureHelpProvider("laua", {
        signatureHelpTriggerCharacters: ["(", ","],

        provideSignatureHelp(model, position) {
          const line = model.getLineContent(position.lineNumber).slice(0, position.column - 1);
          const match = line.match(/([A-Za-z_][A-Za-z0-9_]*)(?:([.:])([A-Za-z_][A-Za-z0-9_]*))?\s*\(([^()]*)$/);
          if (!match) return null;

          const symbols = getLauaSymbols(model.getValue());
          const owner = match[1];
          const operator = match[2];
          const member = match[3];
          const currentArgs = match[4];
          let fnName = owner;
          let params = "";

          if (member) {
            const members = getSymbolMembers(symbols, owner, operator, model.getOffsetAt(position));
            const info = members?.[member];
            if (!info || info.kind !== "function") return null;

            fnName = `${owner}${operator}${member}`;
            params = info.params || "";
          } else if (symbols.localFunctions[owner]) {
            params = symbols.localFunctions[owner].params || "";
          } else {
            return null;
          }

          const parameterNames = params
            ? params.split(",").map(x => x.trim()).filter(Boolean)
            : [];

          return {
            value: {
              signatures: [{
                label: `${fnName}(${params})`,
                documentation: "Laua/Luau function",
                parameters: parameterNames.map(x => ({ label: x }))
              }],
              activeSignature: 0,
              activeParameter: Math.min(
                currentArgs.trim() === "" ? 0 : currentArgs.split(",").length - 1,
                Math.max(0, parameterNames.length - 1)
              )
            },
            dispose() {}
          };
        }
      });

      monaco.languages.registerDefinitionProvider("laua", {
        provideDefinition(model, position) {
          const wordInfo = model.getWordAtPosition(position);
          if (!wordInfo) return null;

          const word = wordInfo.word;
          const symbols = getLauaSymbols(model.getValue());
          const info = symbols.classes[word] || symbols.namespaces[word] || symbols.enums[word];

          if (!info) return null;

          return {
            uri: model.uri,
            range: makeRangeFromOffsets(model, info.start, Math.min(info.end, info.start + word.length + 16))
          };
        }
      });

      const lauaEditor = monaco.editor.create(document.getElementById("lauaEditor"), {
        value: STARTER,
        language: "laua",
        theme: "laua-dark",
        fontSize: 14,
        minimap: { enabled: false },
        automaticLayout: true,
        tabSize: 4,
        insertSpaces: true,
        quickSuggestions: { other: true, comments: false, strings: false },
        suggestOnTriggerCharacters: true,
        snippetSuggestions: "top",
        suggestSelection: "first",
        wordBasedSuggestions: "currentDocument",
        parameterHints: { enabled: true, cycle: true },
        inlineSuggest: { enabled: true },
        stickyScroll: { enabled: true },
        bracketPairColorization: { enabled: true, independentColorPoolPerBracketType: true },
        guides: { bracketPairs: true, bracketPairsHorizontal: true, indentation: true },
        matchBrackets: "always",
        folding: true,
        foldingHighlight: true,
        showFoldingControls: "mouseover",
        smoothScrolling: true,
        cursorSmoothCaretAnimation: "on",
        cursorBlinking: "smooth",
        renderWhitespace: "selection",
        renderControlCharacters: true,
        linkedEditing: true,
        padding: { top: 10, bottom: 10 }
      });

      const luauEditor = monaco.editor.create(document.getElementById("luauEditor"), {
        value: "",
        language: "lua",
        theme: "laua-dark",
        fontSize: 14,
        minimap: { enabled: false },
        automaticLayout: true,
        readOnly: true
      });

      const status = document.getElementById("status");

      function runTranspilerSelfTests() {
        const tests = [
          {
            name: "new without args",
            source: "class myClass\nend\nlocal thing = new myClass",
            expected: "local thing = myClass.new()"
          },
          {
            name: "new with args",
            source: "class myClass\n\tconstructor(value)\n\t\tself.Value = value\n\tend\nend\nlocal thing = new myClass(5)",
            expected: "local thing = myClass.new(5)"
          },
          {
            name: "normal Luau .new",
            source: "local part = Instance.new(\"Part\")",
            expected: "Instance.new(\"Part\")"
          }
        ];

        for (const test of tests) {
          const output = transpile(test.source);

          if (!output.includes(test.expected)) {
            throw new Error(`Self-test failed: ${test.name}`);
          }
        }

        return true;
      }


      const diagnosticsTimer = { id: null };

      function refreshEditorIntelligence() {
        clearTimeout(diagnosticsTimer.id);

        diagnosticsTimer.id = setTimeout(() => {
          updateLauaDiagnostics(lauaEditor.getModel());
        }, 120);
      }

      lauaEditor.onDidChangeModelContent(refreshEditorIntelligence);
      refreshEditorIntelligence();



      function runTranspile() {
        try {
          const output = transpile(lauaEditor.getValue());
          luauEditor.setValue(output);
          status.textContent = "Transpiled successfully.";
          status.className = "ok";
        } catch (err) {
          status.textContent = "Transpile error: " + (err?.message || String(err));
          status.className = "error";
        }
      }

      document.getElementById("transpileBtn").addEventListener("click", runTranspile);
      document.getElementById("exampleBtn").addEventListener("click", () => {
        lauaEditor.setValue(STARTER);
        runTranspile();
      });
      document.getElementById("clearBtn").addEventListener("click", () => {
        lauaEditor.setValue("");
        luauEditor.setValue("");
        status.textContent = "Cleared.";
        status.className = "";
      });

      lauaEditor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, runTranspile);

      runTranspilerSelfTests();
      runTranspile();
    });
  </script>
</body>
