      let lastSuccessfulLuau = null;
      let priorSuccessfulLuau = null;

      function runTranspile() {
        try {
          const file = projectFiles.get(activeFile);
          const importErrors = projectImportMarkers(file);
          if (importErrors.length) throw new Error(importErrors.map(item=>item.message).join("; "));
          const output = transpile(lauaEditor.getValue(), {Mode: document.getElementById("modeSelect").value});
          if (lastSuccessfulLuau !== output) {
            priorSuccessfulLuau = lastSuccessfulLuau;
            lastSuccessfulLuau = output;
          }
          luauEditor.setValue(output);
          file.generated=output;
          const directives = readPlaygroundDirectives(lauaEditor.getValue());
          status.textContent = `Transpiled · ${document.getElementById("modeSelect").value} build · ${directives.mode} · optimize ${directives.optimize ?? "default"} (Roblox handles optimization)`;
          status.className = "ok";
          return output;
        } catch (err) {
          // Never let Copy use stale code from an earlier successful transpilation.
          const failureMessage = err?.message || String(err);
          luauEditor.setValue("-- Transpilation failed. Fix the error in the Laua editor.\n-- " + String(failureMessage).replaceAll("\n", "\n-- "));
          if (activeFile) projectFiles.get(activeFile).generated=null;
          status.textContent = "Transpile error: " + failureMessage;
          status.className = "error";
          return null;
        }
      }

      function generateLauaDocs(source) {
        const declarations = [];
        for (const raw of source.split('\n')) {
          const line = raw.trim();
          const declaration = /^(?:export\s+)?(?:(?:abstract|final)\s+)?(class|namespace|enum)\s+([A-Za-z_]\w*)/.exec(line);
          const func = /^(?:export\s+)?(?:local\s+)?(?:async\s+)?function\s+([A-Za-z_][\w.:]*)\s*\(([^)]*)\)/.exec(line);
          const signal = /^signal\s+([A-Za-z_]\w*)/.exec(line);
          if (declaration) declarations.push(`### ${declaration[1]} ${declaration[2]}\n\n\`${line}\``);
          else if (func) declarations.push(`### function ${func[1]}\n\n\`${line}\``);
          else if (signal) declarations.push(`### signal ${signal[1]}\n\n\`${line}\``);
        }
        return '# Laua declarations\n\nGenerated from the currently open file. This is a declaration index, not full API analysis.\n\n' + (declarations.join('\n\n') || '_No declarations detected._')+'\n';
      }

      function diffLuau(oldText,newText) {
        const oldLines=oldText.split('\n'),newLines=newText.split('\n');
        if (oldLines.length>400 || newLines.length>400) return 'Output exceeds the 400-line diff limit. The code itself was not truncated.';
        const a=oldLines.length,b=newLines.length;
        const matrix=Array.from({length:a+1},()=>new Uint16Array(b+1));
        for(let i=a-1;i>=0;i--){
          for(let j=b-1;j>=0;j--){
            matrix[i][j]=oldLines[i]===newLines[j]?matrix[i+1][j+1]+1:Math.max(matrix[i+1][j],matrix[i][j+1]);
          }
        }
        let i=0,j=0;
        const result=[];
        while(i<a||j<b){
          if(i<a&&j<b&&oldLines[i]===newLines[j]) {result.push('  '+oldLines[i]);i++;j++;}
          else if(i<a&&(j===b||matrix[i+1][j]>=matrix[i][j+1])) result.push('- '+oldLines[i++]);
          else result.push('+ '+newLines[j++]);
        }
        return result.join('\n');
      }

      function downloadPlaygroundText(filename,content) {
        const url=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));
        const link=document.createElement('a');
        link.href=url;
        link.download=filename;
        document.body.appendChild(link);
        link.click();link.remove();URL.revokeObjectURL(url);
      }

      function copyTextFallback(text) {
        const activeElement = document.activeElement;
        const field = document.createElement("textarea");
        field.value = text;
        field.setAttribute("readonly", "");
        field.style.position = "fixed";
        field.style.opacity = "0";
        field.style.left = "-9999px";
        document.body.appendChild(field);
        field.focus();
        field.select();

        let succeeded = false;
        try {
          succeeded = document.execCommand("copy");
        } finally {
          field.remove();
          activeElement?.focus?.();
        }
        if (!succeeded) throw new Error("Browser blocked copying");
      }

      async function copyTranspiledCode() {
        // Transpile again so the copied code always matches the current Laua source.
        if (!lauaEditor.getValue().trim()) {
          status.textContent = "Nothing to copy. Enter Laua code first.";
          status.className = "error";
          return;
        }

        const output = runTranspile();
        if (output === null) return;
        if (!output.trim()) {
          status.textContent = "Nothing to copy. The transpiled output is empty.";
          status.className = "error";
          return;
        }

        copyButton.disabled = true;
        try {
          if (navigator.clipboard?.writeText) {
            try {
              await navigator.clipboard.writeText(output);
            } catch {
              copyTextFallback(output);
            }
          } else {
            copyTextFallback(output);
          }

          status.textContent = "Copied transpiled Luau to clipboard.";
          status.className = "ok";
          copyButton.textContent = "Copied!";
          setTimeout(() => { copyButton.textContent = "Copy Luau"; }, 1500);
        } catch (err) {
          status.textContent = "Copy failed: " + (err?.message || String(err));
          status.className = "error";
        } finally {
          copyButton.disabled = false;
        }
      }


      document.getElementById("newFileBtn").addEventListener("click",()=>{
        const name=prompt("New Laua file name (example: Modules/Enemy.laua)","NewFile.laua");
        if(name===null)return;
        try{createProjectFile(name,"");lintAllProjectFiles();}catch(error){status.textContent=error.message;status.className="error";}
      });
      document.getElementById("renameFileBtn").addEventListener("click",()=>{
        const name=prompt("Rename the selected Laua file",activeFile);
        if(name===null)return;
        try{renameProjectFile(activeFile,name);}catch(error){status.textContent=error.message;status.className="error";}
      });
      document.getElementById("openFilesBtn").addEventListener("click",()=>document.getElementById("openFilesInput").click());
      document.getElementById("openFilesInput").addEventListener("change",async event=>{
        const files=[...event.target.files];
        let count=0,errors=[];
        for(const diskFile of files){
          try {
            const name=normalizeProjectFilename(diskFile.webkitRelativePath || diskFile.name);
            if(projectFiles.has(name))throw new Error(`${name} already exists. Rename it before importing.`);
            createProjectFile(name,await diskFile.text());count++;
          }catch(error){errors.push(error.message);}
        }
        event.target.value="";
        lintAllProjectFiles();
        status.textContent=`Opened ${count} file(s).${errors.length?" "+errors.join(" | "):""}`;
        status.className=errors.length?"error":"ok";
      });
      document.getElementById("exportProjectBtn").addEventListener("click",exportProject);

      document.getElementById("lintBtn").addEventListener("click", () => runLint(true));
      document.getElementById("transpileBtn").addEventListener("click", runTranspile);
      copyButton.addEventListener("click", copyTranspiledCode);
      document.getElementById("modeSelect").addEventListener("change", runTranspile);
      document.getElementById("closeDiffBtn").addEventListener("click", () => document.getElementById("diffDialog").close());
      document.getElementById("diffBtn").addEventListener("click", () => {
        if (priorSuccessfulLuau === null || lastSuccessfulLuau === null) {
          status.textContent="Transpile two different versions before opening Output Diff.";
          status.className="error";
          return;
        }
        document.getElementById("diffResult").textContent=diffLuau(priorSuccessfulLuau,lastSuccessfulLuau);
        document.getElementById("diffDialog").showModal();
      });
      document.getElementById("docsBtn").addEventListener("click", () => {
        downloadPlaygroundText("Laua_DEFINITIONS.md",generateLauaDocs(lauaEditor.getValue()));
        status.textContent="Exported Laua_DEFINITIONS.md";
        status.className="ok";
      });
      document.getElementById("testsBtn").addEventListener("click", () => {
        try {
          runTranspilerSelfTests();
          const release = transpile("--#if RELEASE\nprint('release')\n--#else\nprint('debug')\n--#end", {Mode:"Release"});
          if (!release.includes("print('release')") || release.includes("print('debug')")) throw new Error("Release mode failed");
          status.textContent = "Compiler regression tests passed.";
          status.className = "ok";
        } catch (error) {
          status.textContent = "Tests failed: " + (error?.message || String(error));
          status.className = "error";
        }
      });
      document.getElementById("exportBtn").addEventListener("click", () => {
        const output = runTranspile();
        if (output === null) return;
        const url = URL.createObjectURL(new Blob([output], {type:"text/plain;charset=utf-8"}));
        const a = document.createElement("a");
        a.href = url;
        a.download = removeLauaExtension(activeFile).split("/").at(-1)+".luau";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        status.textContent = `Exported ${activeFile} as Luau`;
        status.className = "ok";
      });
      function loadDefaultMain() {
        let main = projectFiles.get("main.laua");
        if (!main) {
          main = createProjectFile("main.laua", STARTER);
        } else if (main.model.getValue() !== STARTER) {
          const isUntouchedOldDemo = main.model.getValue() === PREVIOUS_MAIN_STARTER;
          // Do not silently discard a user's saved edits or deliberately empty file.
          if (!isUntouchedOldDemo && !confirm("Replace main.laua with the default example? Your current main.laua code will be overwritten. Other files are unchanged.")) return;
          main.model.setValue(STARTER);
        }
        switchProjectFile("main.laua");
        runTranspile();
        status.textContent = "Loaded default example into main.laua · Other files unchanged";
        status.className = "ok";
      }

      document.getElementById("exampleBtn").addEventListener("click", loadDefaultMain);
      document.getElementById("clearBtn").addEventListener("click", () => {
        lauaEditor.setValue("");
        luauEditor.setValue("");
        status.textContent = "Cleared.";
        status.className = "";
      });

      lauaEditor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, runTranspile);
      lauaEditor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyMod.Shift | monaco.KeyCode.KeyL, () => runLint(true));

      // Always launch with main.laua selected and populated. Other saved
      // .laua files remain available as tabs, including Zombie.laua.
      const savedProject = restoredProject();
      const seed = savedProject?.files || [{name:"main.laua",source:STARTER}];
      for (const entry of seed) createProjectFile(entry.name,entry.source,{silent:true});
      projectReady = true;
      switchProjectFile("main.laua");

      // A failed background self-test should never prevent the starter editor
      // from appearing. The Tests button can still report full test failures.
      let startupTestError = null;
      try { runTranspilerSelfTests(); }
      catch (error) {
        startupTestError = error;
        console.error("Laua compiler self-test failed:", error);
      }
      runTranspile();
      if (startupTestError) {
        status.textContent += " · Compiler self-tests reported a problem; open Tests for details.";
        status.className = "error";
      }
      playgroundInitialized = true;
      if (savedProject && projectFiles.get("main.laua")?.model.getValue() !== STARTER) {
        status.textContent += " · Your saved main.laua was restored unchanged.";
      }
    }, function (error) {
      const status = document.getElementById("status");
      status.textContent = "Could not initialize the code editor. Refresh this page or check your connection.";
      status.className = "error";
      console.error("Laua Monaco initialization error", error);
    });
    }

    if (typeof require === "function" && typeof require.config === "function") {
      initializeLauaPlayground();
    } else {
      window.addEventListener("laua-monaco-loader-ready", initializeLauaPlayground, { once: true });
    }
  </script>
</body>
