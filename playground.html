<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Laua Playground</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: Inter, system-ui, Arial, sans-serif; background: #0f1115; color: #f4f4f5; }
    body { display: flex; flex-direction: column; }
    header {
      height: 58px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px; border-bottom: 1px solid #2a2f3a; background: #151922;
    }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand h1 { margin: 0; font-size: 20px; }
    .brand span { color: #9aa4b2; font-size: 13px; }
    .actions { display: flex; gap: 8px; }
    button {
      border: 1px solid #343b49; border-radius: 8px; background: #232936; color: #f4f4f5;
      padding: 8px 13px; cursor: pointer; font-weight: 600;
    }
    button:hover { background: #2b3342; }
    .mode-label { display:flex; align-items:center; gap:6px; font-size:12px; color:#cbd5e1; }
    select { background:#232936; border:1px solid #343b49; border-radius:7px; color:#f4f4f5; padding:7px; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #transpileBtn { background: #2563eb; border-color: #2563eb; }
    #transpileBtn:hover { background: #1d4ed8; }
    main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
    .pane { min-width: 0; display: flex; flex-direction: column; }
    .pane:first-child { border-right: 1px solid #2a2f3a; }
    .pane-title {
      height: 38px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; background: #151922; border-bottom: 1px solid #2a2f3a;
      color: #cbd5e1; font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    }
    .editor { flex: 1; min-height: 0; }
    #status {
      height: 30px; display: flex; align-items: center; padding: 0 12px;
      border-top: 1px solid #2a2f3a; background: #151922; color: #94a3b8; font-size: 12px;
    }
    dialog { width:min(950px,94vw); max-height:85vh; background:#161b26; border:1px solid #3a4557; border-radius:12px; color:#e5e7eb; }
    dialog::backdrop { background:rgba(0,0,0,.7); }
    #diffResult { max-height:65vh; overflow:auto; background:#0c1018; padding:14px; font-size:12px; white-space:pre; line-height:1.5; }

    /* v3.13 multi-file project workspace */
    .actions { flex-wrap: wrap; justify-content: flex-end; }
    .file-tabs { display:flex; align-items:center; gap:3px; flex:1; min-width:0; overflow-x:auto; scrollbar-width:thin; }
    .file-tab { white-space:nowrap; display:inline-flex; align-items:center; gap:7px; background:transparent; color:#a6b3c6; border:1px solid transparent; border-bottom:2px solid transparent; border-radius:7px 7px 0 0; padding:7px 9px; font-size:12px; font-weight:500; }
    .file-tab:hover { background:#232b3b; }
    .file-tab.active { color:#f8fafc; background:#202739; border-color:#344155; border-bottom-color:#60a5fa; }
    .file-tab .file-error { color:#fca5a5; font-size:11px; }
    .file-tab .file-close { border:0; background:none; color:#94a3b8; padding:0 3px; font-size:16px; font-weight:400; line-height:1; }
    .file-tab .file-close:hover { color:white; background:#38465c; }
    .file-tab:focus-visible,.file-close:focus-visible { outline:2px solid #60a5fa; outline-offset:-2px; }
    .tab-add { flex:none; border-radius:6px; padding:5px 10px; font-size:16px; }
    .tab-action { font-size:11px; padding:5px 8px; flex:none; }
    .pane-title.has-tabs { height:auto; min-height:42px; text-transform:none; letter-spacing:normal; gap:8px; }
    .file-tools { display:flex; gap:5px; align-items:center; flex:none; }
    .filename-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px; }
    .panel-subtitle { font-size:11px; color:#748297; letter-spacing:0; text-transform:none; }
    @media (max-width:1100px) { .file-tools .tab-action { padding:5px; } }
    .ok { color: #86efac !important; }
    .error { color: #fca5a5 !important; }
    @media (max-width: 850px) {
      header { height: auto; min-height: 58px; flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
      .actions { flex-wrap: wrap; }
      main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
      .pane:first-child { border-right: 0; border-bottom: 1px solid #2a2f3a; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Laua Playground</h1>
      <span>pronounced “Lawah” · v3.13 · multi-file · live lint</span>
    </div>
    <div class="actions">
      <button id="exampleBtn" title="Load the built-in starter example into main.laua (other files stay unchanged)">Default main.laua</button>
      <button id="clearBtn">Clear</button>
      <button id="lintBtn">Lint</button>
      <label class="mode-label" for="modeSelect">Mode
        <select id="modeSelect" aria-label="Laua compile mode">
          <option value="Development">Development</option>
          <option value="Release">Release</option>
          <option value="Debug">Debug</option>
        </select>
      </label>
      <button id="transpileBtn">Transpile</button>
      <button id="testsBtn" title="Run compiler regression tests">Tests</button>
      <button id="diffBtn" title="Compare the last two generated outputs">Output Diff</button>
      <button id="docsBtn" title="Generate reference documentation from Laua declarations">Docs</button>
      <button id="exportBtn" title="Export active file as Luau">Export Luau</button>
      <button id="exportProjectBtn" title="Export all Laua sources and generated Luau in a ZIP">Export Project ZIP</button>
      <button id="copyBtn" title="Copy generated Luau code">Copy Luau</button>
    </div>
  </header>

  <main>
    <section class="pane">
      <div class="pane-title has-tabs">
        <div id="fileTabs" class="file-tabs" role="tablist" aria-label="Laua project files"></div>
        <div class="file-tools">
          <button id="newFileBtn" class="tab-add" title="New .laua file" aria-label="New .laua file">+</button>
          <button id="renameFileBtn" class="tab-action" title="Rename selected file">Rename</button>
          <button id="openFilesBtn" class="tab-action" title="Open .laua files from your computer">Open</button>
          <input id="openFilesInput" type="file" accept=".laua,text/plain" multiple hidden />
        </div>
      </div>
      <div id="lauaEditor" class="editor"></div>
    </section>

    <section class="pane">
      <div class="pane-title"><span>Luau Output</span><span id="outputFilename" class="filename-label">main.luau · read only</span></div>
      <div id="luauEditor" class="editor"></div>
    </section>
  </main>

  <div id="status" role="status" aria-live="polite">Loading Laua Playground...</div>
  <dialog id="diffDialog" aria-label="Generated output differences">
    <div style="display:flex;gap:14px;align-items:center;justify-content:space-between">
      <strong>Generated Luau changes</strong>
      <button id="closeDiffBtn">Close</button>
    </div>
    <pre id="diffResult"></pre>
  </dialog>

  <script>
    // The editor must not silently show an empty screen when a CDN is blocked.
    (function loadLauaMonacoLoader() {
      const urls = [
        "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js",
        "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.min.js",
        "https://unpkg.com/monaco-editor@0.52.2/min/vs/loader.min.js"
      ];
      const status = document.getElementById("status");
      function load(index) {
        if (index >= urls.length) {
          status.textContent = "Could not load the code editor. Check your internet connection and refresh the page.";
          status.className = "error";
          return;
        }
        const loader = document.createElement("script");
        loader.src = urls[index];
        loader.onload = () => {
          if (typeof window.require === "function" && typeof window.require.config === "function") {
            window.__lauaMonacoAssetsUrl = urls[index].replace(/\/loader\.min\.js$/, "");
            window.dispatchEvent(new Event("laua-monaco-loader-ready"));
          } else {
            loader.remove();
            load(index + 1);
          }
        };
        loader.onerror = () => {
          loader.remove();
          load(index + 1);
        };
        document.head.appendChild(loader);
      }
      load(0);
    })();
  </script>
  <script>

    const STARTER = `--!strict
class Character
    private Health = 100

    get IsAlive()
        return self.Health > 0
    end
end

async function CheckCharacter()
    using connection = game:GetService("RunService").Heartbeat:Connect(function(dt)

    end)

    task.wait(0.1)

async function LauaAsyncOperation()

local operation = CheckCharacter()
operation:andThen(function(result)

-- Laua examples
local numbers = {1, 2, 3}
local doubled = (n) => n * 2
local mapped = table.map(numbers, doubled)
local allNumbers = {...numbers, ...mapped}
local message = "Welcome to Laua"
local part = message[1:7]`;

    const PREVIOUS_MAIN_STARTER = "import {Zombie} from \"./Zombie\"\nimport {Player} from \"./Player\"\n\nlocal zombie = new Zombie\nlocal player = new Player\nprint(zombie.Health, player.Name)";

    function replaceRange(source, start, end, replacement) {
      return source.slice(0, start) + replacement + source.slice(end);
    }

    function normalizeBlockIndent(source, indent = "    ") {
      const lines = source.replace(/\r\n/g, "\n").split("\n");

      while (lines.length > 0 && lines[0].trim() === "") lines.shift();
      while (lines.length > 0 && lines[lines.length - 1].trim() === "") lines.pop();

      if (lines.length === 0) return "";

      let smallestIndent = Infinity;

      for (const line of lines) {
        if (line.trim() === "") continue;

        const leading = line.match(/^[\t ]*/)?.[0].length || 0;
        if (leading < smallestIndent) smallestIndent = leading;
      }

      if (!Number.isFinite(smallestIndent)) smallestIndent = 0;

      return lines.map(line => {
        if (line.trim() === "") return "";
        return indent + line.slice(smallestIndent);
      }).join("\n");
    }

    function isIdent(ch) {
      return !!ch && /[A-Za-z0-9_]/.test(ch);
    }

    function maskNonCode(source, preserveDirectives = false) {
      const out = source.split("");
      let i = 0;
      let quote = null;
      let lineComment = false;
      let blockComment = false;

      while (i < source.length) {
        const one = source[i];
        const two = source.slice(i, i + 2);
        const four = source.slice(i, i + 4);

        if (quote) {
          if (one === "\\") {
            out[i] = " ";
            if (i + 1 < out.length) out[i + 1] = " ";
            i += 2;
            continue;
          }
          if (one === quote) quote = null;
          if (one !== "\n") out[i] = " ";
          i++;
          continue;
        }

        if (lineComment) {
          if (one === "\n") {
            lineComment = false;
          } else {
            out[i] = " ";
          }
          i++;
          continue;
        }

        if (blockComment) {
          if (two === "]]") {
            out[i] = " ";
            if (i + 1 < out.length) out[i + 1] = " ";
            blockComment = false;
            i += 2;
            continue;
          }
          if (one !== "\n") out[i] = " ";
          i++;
          continue;
        }

        if (four === "--[[") {
          for (let j = 0; j < 4; j++) if (i + j < out.length) out[i + j] = " ";
          blockComment = true;
          i += 4;
          continue;
        }

        if (two === "--" && preserveDirectives && source[i + 2] === "!") {
          while (i < source.length && source[i] !== "\n") i++;
          continue;
        }

        if (two === "--") {
          out[i] = " ";
          if (i + 1 < out.length) out[i + 1] = " ";
          lineComment = true;
          i += 2;
          continue;
        }

        if (one === '"' || one === "'") {
          quote = one;
          out[i] = " ";
          i++;
          continue;
        }

        i++;
      }

      return out.join("");
    }

    function findKeyword(masked, keyword, from = 0) {
      let i = from;

      while ((i = masked.indexOf(keyword, i)) !== -1) {
        const before = masked[i - 1] || "";
        const after = masked[i + keyword.length] || "";

        const validBefore =
          !isIdent(before) &&
          before !== "." &&
          before !== ":";

        const validAfter = !isIdent(after);

        if (validBefore && validAfter) return i;

        i += keyword.length;
      }

      return -1;
    }

    function findMatchingParen(source, openIndex) {
      const masked = maskNonCode(source);
      let depth = 0;
      for (let i = openIndex; i < source.length; i++) {
        if (masked[i] === "(") depth++;
        if (masked[i] === ")") {
          depth--;
          if (depth === 0) return i;
        }
      }
      throw new Error("Expected ')'");
    }

    function splitLinesWithOffsets(source) {
      const lines = [];
      let start = 0;
      for (let i = 0; i <= source.length; i++) {
        if (i === source.length || source[i] === "\n") {
          lines.push({ start, end: i, text: source.slice(start, i) });
          start = i + 1;
        }
      }
      return lines;
    }

    function findMatchingEndByLines(source, startIndex) {
      const lines = splitLinesWithOffsets(source);
      const startLine = lines.findIndex(line => startIndex >= line.start && startIndex <= line.end);
      let depth = 0;

      for (let li = startLine; li < lines.length; li++) {
        const raw = lines[li].text;
        const maskedLine = maskNonCode(raw).trim();
        if (!maskedLine) continue;

        const opens =
          /^(abstract\s+|final\s+)?class\b/.test(maskedLine) ||
          /^namespace\b/.test(maskedLine) ||
          /^enum\b/.test(maskedLine) ||
          /^match\b/.test(maskedLine) ||
          /^operator\s+/.test(maskedLine) ||
          /^watch\s+[A-Za-z_][A-Za-z0-9_]*\s*\(/.test(maskedLine) ||
          /^constructor\s*\(/.test(maskedLine) ||
          /^(get|set)\s+[A-Za-z_][A-Za-z0-9_]*\s*\(/.test(maskedLine) ||
          /^defer\s*$/.test(maskedLine) ||
          /^async\s+function\b/.test(maskedLine) ||
          /^local\s+async\s+function\b/.test(maskedLine) ||
          /^[A-Za-z_][A-Za-z0-9_.]*\s*=\s*function\s*\(/.test(maskedLine) ||
          /^(public|private|protected|static|override|abstract|final|\s)*\s*(?:async\s+)?function\b/.test(maskedLine) ||
          /^(?:async\s+)?function\b/.test(maskedLine) ||
          /^local\s+(?:async\s+)?function\b/.test(maskedLine) ||
          /^if\b.*\bthen\s*$/.test(maskedLine) ||
          /^for\b.*\bdo\s*$/.test(maskedLine) ||
          /^while\b.*\bdo\s*$/.test(maskedLine) ||
          /^do\s*$/.test(maskedLine) ||
          /^repeat\s*$/.test(maskedLine);

        if (opens) depth++;

        if (/^until\b/.test(maskedLine)) {
          depth--;
          if (depth === 0) return { start: lines[li].start, end: lines[li].end };
        }

        if (/^end\s*;?\s*$/.test(maskedLine)) {
          depth--;
          if (depth === 0) return { start: lines[li].start, end: lines[li].end };
        }
      }

      throw new Error("Expected 'end'");
    }

    function transpileNew(source) {
      while (true) {
        const masked = maskNonCode(source);
        const idx = findKeyword(masked, "new");
        if (idx === -1) break;

        let i = idx + 3;
        while (/\s/.test(source[i] || "")) i++;

        const start = i;
        while (/[A-Za-z0-9_.]/.test(source[i] || "")) i++;
        const name = source.slice(start, i);

        if (!name) throw new Error("Expected class name after 'new'");

        let p = i;
        while (/\s/.test(source[p] || "")) p++;

        if (source[p] === "(") {
          source = source.slice(0, idx) + name + ".new" + source.slice(i);
        } else {
          source = source.slice(0, idx) + name + ".new()" + source.slice(i);
        }
      }

      return source;
    }

    function transpileEnum(source) {
      while (true) {
        const masked = maskNonCode(source);
        const idx = findKeyword(masked, "enum");
        if (idx === -1) break;

        const headerEnd = source.indexOf("\n", idx);
        if (headerEnd === -1) throw new Error("Enum body expected");

        const header = source.slice(idx, headerEnd).trim();
        const m = header.match(/^enum\s+([A-Za-z_][A-Za-z0-9_]*)$/);
        if (!m) throw new Error("Invalid enum declaration");

        const name = m[1];
        const endPos = findMatchingEndByLines(source, idx);
        const body = source.slice(headerEnd + 1, endPos.start);
        const members = [];
        let auto = 0;

        for (const raw of body.split("\n")) {
          let line = raw.trim().replace(/,$/, "");
          if (!line || line.startsWith("--")) continue;

          let mm = line.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+)$/);
          if (mm) {
            members.push(`    ${mm[1]} = ${mm[2]},`);
          } else {
            mm = line.match(/^([A-Za-z_][A-Za-z0-9_]*)$/);
            if (!mm) throw new Error(`Invalid enum member: ${line}`);
            members.push(`    ${mm[1]} = ${auto},`);
            auto++;
          }
        }

        const result = `local ${name} = table.freeze({\n${members.join("\n")}\n})`;
        source = source.slice(0, idx) + result + source.slice(endPos.end);
      }

      return source;
    }

    function transpileNamespace(source) {
      while (true) {
        const masked = maskNonCode(source);

        if (!shouldExposeRobloxEnumItem(item)) continue;

        members[item.Name] = {
          kind: "enum",
          detail: `Enum.${enumName}`
        };
      }

      return members;
    }

    function getGameApiMembers() {
      const members = {
        ...getRobloxApiMembers("DataModel")
      };

      // Services are children of DataModel and are commonly addressed as
      // game.Players, game.Workspace, game.Lighting, etc. Add every service
      // from the current API dump rather than maintaining a small manual list.
      for (const serviceName of ROBLOX_API.services) {
        members[serviceName] = {
          kind: "field",
          detail: `Roblox service · ${serviceName}`,
          returnClass: serviceName
        };
      }

      // Keep the canonical Workspace alias visible even if dump metadata
      // changes how the class is tagged.
      members.Workspace = {
        kind: "field",
        detail: "Roblox service · Workspace",
        returnClass: "Workspace"
      };

      return members;
    }

    let robloxApiLoadPromise = null;

    function installRobloxApiDump(dump, metadata = {}) {
      ROBLOX_API.classes.clear();
      ROBLOX_API.enums.clear();
      ROBLOX_API.services.clear();

      ROBLOX_API.stats = {
        classes: 0,
        members: 0,
        enums: 0,
        enumItems: 0,
        deprecatedFiltered: 0,
        notScriptableFiltered: 0,
        restrictedFiltered: 0
      };

      for (const classInfo of dump.Classes || []) {
        if (!shouldExposeRobloxClass(classInfo)) {
          if (isRobloxDeprecated(classInfo)) {
            ROBLOX_API.stats.deprecatedFiltered += 1;
          }

          if (isRobloxNotScriptable(classInfo)) {
            ROBLOX_API.stats.notScriptableFiltered += 1;
          }

          continue;
        }

        ROBLOX_API.classes.set(classInfo.Name, classInfo);
        ROBLOX_API.stats.classes += 1;

        const tags = robloxTags(classInfo);

        if (tags.includes("Service") || classInfo.Name === "Workspace") {
          ROBLOX_API.services.add(classInfo.Name);
        }

        for (const member of classInfo.Members || []) {
          // Count only members that would actually be exposed.
          if (
            !isRobloxDeprecated(member) &&
            !isRobloxNotScriptable(member) &&
            isRobloxMemberAccessible(member)
          ) {
            ROBLOX_API.stats.members += 1;
          }
        }
      }

      for (const enumInfo of dump.Enums || []) {
        if (!shouldExposeRobloxEnum(enumInfo)) {
          if (isRobloxDeprecated(enumInfo)) {
            ROBLOX_API.stats.deprecatedFiltered += 1;
          }

          continue;
        }

        ROBLOX_API.enums.set(enumInfo.Name, enumInfo);
        ROBLOX_API.stats.enums += 1;

        for (const item of enumInfo.Items || []) {
          if (shouldExposeRobloxEnumItem(item)) {
            ROBLOX_API.stats.enumItems += 1;
          } else if (isRobloxDeprecated(item)) {
            ROBLOX_API.stats.deprecatedFiltered += 1;
          }
        }
      }

      ROBLOX_API.version = metadata.version || null;
      ROBLOX_API.source = metadata.source || null;
      ROBLOX_API.ready =
        ROBLOX_API.classes.size > 0 &&
        ROBLOX_API.enums.size > 0;
      ROBLOX_API.failed = !ROBLOX_API.ready;

      return ROBLOX_API.ready;
    }

    async function fetchJson(url) {
      const response = await fetch(url, {
        cache: "no-store",
        mode: "cors"
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status} from ${url}`);
      }

      return response.json();
    }

    async function loadRobloxApiDump() {
      if (ROBLOX_API.ready) return true;

      let lastError = null;

      // First use Roblox's current Studio version and official API dump.
      try {
        const versionData = await fetchJson(
          "https://clientsettingscdn.roblox.com/v2/client-version/WindowsStudio64"
        );

        if (versionData?.clientVersionUpload) {
          const dump = await fetchJson(
            `https://setup.rbxcdn.com/${versionData.clientVersionUpload}-API-Dump.json`
          );

          if (installRobloxApiDump(dump, {
            version: versionData.version || versionData.clientVersionUpload,
            source: "Roblox current Studio API dump"
          })) return true;
        }
      } catch (error) {
        lastError = error;
      }

      // Then try mirrors.
      for (const url of ROBLOX_API_FALLBACK_URLS) {
        try {
          const dump = await fetchJson(url);

          if (installRobloxApiDump(dump, {
            version: null,
            source: "Roblox Client Tracker fallback"
          })) return true;
        } catch (error) {
          lastError = error;
        }
      }

      ROBLOX_API.ready = false;
      ROBLOX_API.failed = true;

      console.warn("Could not load Roblox API dump:", lastError);
      return false;
    }

    function verifyRobloxApiDatabase() {
      const problems = [];

      if (!ROBLOX_API.ready) {
        problems.push("API database is not loaded.");
        return {
          ok: false,
          problems
        };
      }

      if (!ROBLOX_API.classes.has("DataModel")) {
        problems.push("DataModel class is missing.");
      }

      if (!ROBLOX_API.classes.has("Instance")) {
        problems.push("Instance class is missing.");
      }

      if (!ROBLOX_API.enums.has("KeyCode")) {
        problems.push("KeyCode enum is missing.");
      }

      const gameMembers = getGameApiMembers();

      if (!gameMembers.GetService) {
        problems.push("game.GetService is missing.");
      }

      if (!gameMembers.Workspace) {
        problems.push("game.Workspace is missing.");
      }

      for (const [className, classInfo] of ROBLOX_API.classes) {
        if (isRobloxDeprecated(classInfo)) {
          problems.push(`Deprecated class leaked into autocomplete: ${className}`);
          break;
        }

        const exposed = getRobloxApiMembers(className);

        for (const member of classInfo.Members || []) {
          if (
            (isRobloxDeprecated(member) || isRobloxNotScriptable(member)) &&
            exposed[member.Name]?.apiMember === member
          ) {
            problems.push(`Filtered member leaked into autocomplete: ${className}.${member.Name}`);
            break;
          }
        }

        if (problems.length > 0) break;
      }

      // These counts are sanity checks for a real modern dump rather than
      // a tiny or malformed response.
      if (ROBLOX_API.stats.classes < 500) {
        problems.push(`Only ${ROBLOX_API.stats.classes} classes loaded.`);
      }

      if (ROBLOX_API.stats.members < 3000) {
        problems.push(`Only ${ROBLOX_API.stats.members} usable members loaded.`);
      }

      ROBLOX_API.verified = problems.length === 0;

      return {
        ok: ROBLOX_API.verified,
        problems
      };
    }

    function ensureRobloxApiLoaded() {
      if (ROBLOX_API.ready) return Promise.resolve(true);

      if (!robloxApiLoadPromise) {
        robloxApiLoadPromise = loadRobloxApiDump().finally(() => {
          if (!ROBLOX_API.ready) robloxApiLoadPromise = null;
        });
      }

      return robloxApiLoadPromise;
    }

    function membersToCompletionMap(rawMembers, detailPrefix) {
      const result = {};

      for (const [name, kind] of Object.entries(rawMembers || {})) {
        result[name] = {
          kind,
          detail: `${detailPrefix} ${kind === "function" ? "method" : "member"}`
        };
      }

      return result;
    }

    function getWordRange(model, position) {
      const word = model.getWordUntilPosition(position);

      return new monaco.Range(
        position.lineNumber,
        word.startColumn,
        position.lineNumber,
        word.endColumn
      );
    }

    function getSymbolMembers(symbols, owner, operator, cursorOffset) {
      // User-defined Laua symbols always win.
      if (symbols.namespaces[owner]) return symbols.namespaces[owner].members;
      if (symbols.enums[owner]) return symbols.enums[owner].members;
      if (symbols.classes[owner]) return collectClassMembers(symbols, owner, true);
      if (symbols.variables[owner]) return collectClassMembers(symbols, symbols.variables[owner].className, false);

      // Luau standard libraries.
      if (LIBRARY_MEMBERS[owner]) {
        const members = {};

        for (const member of LIBRARY_MEMBERS[owner]) {
          members[member] = {
            kind: "function",
            detail: `${owner} member`
          };
        }

        return members;
      }

      // Roblox enums from the current API dump.
      if (owner === "Enum" && ROBLOX_API.ready) {
        return getRobloxEnumTypes();
      }

      if (ROBLOX_API.ready && ROBLOX_API.enums.has(owner)) {
        return getRobloxEnumItems(owner);
      }

      // Roblox global objects.
      if (owner === "game") {
        if (ROBLOX_API.ready) return getGameApiMembers();

        return {
          GetService: { kind: "function", detail: "DataModel method" },
          FindService: { kind: "function", detail: "DataModel method" },
          GetObjects: { kind: "function", detail: "DataModel method" },
          BindToClose: { kind: "function", detail: "DataModel method" },
          IsLoaded: { kind: "function", detail: "DataModel method" },
          Loaded: { kind: "event", detail: "DataModel event" },
          Workspace: { kind: "field", detail: "Workspace", returnClass: "Workspace" }
        };
      }

      if (owner === "workspace") {
        if (ROBLOX_API.ready) return getRobloxApiMembers("Workspace");

        return membersToCompletionMap(BUILTIN_MEMBER_SETS.Workspace || {}, "Workspace");
      }

      // Static Roblox datatype/class members.
      if (ROBLOX_API.ready && ROBLOX_API.classes.has(owner)) {
        return getRobloxApiMembers(owner);
      }

      if (BUILTIN_MEMBER_SETS[owner]) {
        return membersToCompletionMap(BUILTIN_MEMBER_SETS[owner], owner);
      }

      const localInfo = symbols.locals[owner];

      if (localInfo) {
        const typeName = localInfo.type?.replace(/\?$/, "").trim();

        if (typeName && symbols.classes[typeName]) {
          return collectClassMembers(symbols, typeName, false);
        }

        if (ROBLOX_API.ready && typeName && ROBLOX_API.classes.has(typeName)) {
          return getRobloxApiMembers(typeName);
        }

        if (typeName && BUILTIN_MEMBER_SETS[typeName]) {
          return membersToCompletionMap(BUILTIN_MEMBER_SETS[typeName], typeName);
        }

        if (localInfo.service) {
          if (ROBLOX_API.ready && ROBLOX_API.classes.has(localInfo.service)) {
            return getRobloxApiMembers(localInfo.service);
          }

          if (SERVICE_MEMBER_SETS[localInfo.service]) {
            return membersToCompletionMap(SERVICE_MEMBER_SETS[localInfo.service], localInfo.service);
          }
        }

        if (localInfo.robloxClass) {
          if (ROBLOX_API.ready && ROBLOX_API.classes.has(localInfo.robloxClass)) {
            return getRobloxApiMembers(localInfo.robloxClass);
          }

          if (BUILTIN_MEMBER_SETS[localInfo.robloxClass]) {
            return membersToCompletionMap(BUILTIN_MEMBER_SETS[localInfo.robloxClass], localInfo.robloxClass);
          }
        }

        if (localInfo.alias) {
          if (symbols.namespaces[localInfo.alias]) return symbols.namespaces[localInfo.alias].members;
          if (symbols.enums[localInfo.alias]) return symbols.enums[localInfo.alias].members;
          if (symbols.classes[localInfo.alias]) return collectClassMembers(symbols, localInfo.alias, true);

          if (ROBLOX_API.ready && ROBLOX_API.classes.has(localInfo.alias)) {
            return getRobloxApiMembers(localInfo.alias);
          }
        }

        if (localInfo.tableMembers) return localInfo.tableMembers;
      }

      const parameterInfo = symbols.parameters[owner];

      if (parameterInfo?.type) {
        const typeName = parameterInfo.type.replace(/\?$/, "").trim();

        if (symbols.classes[typeName]) {
          return collectClassMembers(symbols, typeName, false);
        }

        if (ROBLOX_API.ready && ROBLOX_API.classes.has(typeName)) {
          return getRobloxApiMembers(typeName);
        }

        if (BUILTIN_MEMBER_SETS[typeName]) {
          return membersToCompletionMap(BUILTIN_MEMBER_SETS[typeName], typeName);
        }
      }

      const enclosingClass = findClassAtOffset(symbols, cursorOffset);

      if (owner === "self" && enclosingClass) {
        return collectClassMembers(symbols, enclosingClass.name, false);
      }

      if (owner === "super" && enclosingClass?.base) {
        return collectClassMembers(symbols, enclosingClass.base, operator === ".");
      }

      return null;
    }

    function enrichLocalSymbols(source, symbols) {
      const servicePattern = /\blocal\s+([A-Za-z_][A-Za-z0-9_]*)\s*=\s*game:GetService\s*\(\s*["']([A-Za-z_][A-Za-z0-9_]*)["']\s*\)/g;
      let match;

      while ((match = servicePattern.exec(source)) !== null) {
        if (!symbols.locals[match[1]]) {
          symbols.locals[match[1]] = { name: match[1], type: null, detail: "Local variable" };
        }

        symbols.locals[match[1]].service = match[2];
        symbols.locals[match[1]].robloxClass = match[2];
        symbols.locals[match[1]].detail = `Roblox service: ${match[2]}`;
      }

      const instancePattern = /\blocal\s+([A-Za-z_][A-Za-z0-9_]*)\s*=\s*Instance\.new\s*\(\s*["']([A-Za-z_][A-Za-z0-9_]*)["']/g;

      while ((match = instancePattern.exec(source)) !== null) {
        if (!symbols.locals[match[1]]) {
          symbols.locals[match[1]] = { name: match[1], type: null, detail: "Local variable" };
        }

        symbols.locals[match[1]].robloxClass = match[2];
        symbols.locals[match[1]].detail = `Roblox instance: ${match[2]}`;
      }

      const workspaceAliasPattern = /\blocal\s+([A-Za-z_][A-Za-z0-9_]*)\s*=\s*workspace\b/g;

      while ((match = workspaceAliasPattern.exec(source)) !== null) {
        if (!symbols.locals[match[1]]) {
          symbols.locals[match[1]] = { name: match[1], type: null, detail: "Local variable" };
        }

        symbols.locals[match[1]].robloxClass = "Workspace";
        symbols.locals[match[1]].detail = "Roblox Workspace";
      }

      const gameServicePropertyPattern = /\blocal\s+([A-Za-z_][A-Za-z0-9_]*)\s*=\s*game\.([A-Za-z_][A-Za-z0-9_]*)/g;

      while ((match = gameServicePropertyPattern.exec(source)) !== null) {
        const possibleClass = match[2];

        if (
          ROBLOX_API.ready &&
          ROBLOX_API.classes.has(possibleClass)
        ) {
          if (!symbols.locals[match[1]]) {
            symbols.locals[match[1]] = { name: match[1], type: null, detail: "Local variable" };
          }

          symbols.locals[match[1]].robloxClass = possibleClass;
          symbols.locals[match[1]].detail = `Roblox object: ${possibleClass}`;
        }
      }

      const aliasPattern = /\blocal\s+([A-Za-z_][A-Za-z0-9_]*)\s*=\s*([A-Za-z_][A-Za-z0-9_]*)\s*(?:\n|$)/g;

      while ((match = aliasPattern.exec(source)) !== null) {
        const target = match[2];

        if (
          symbols.namespaces[target] ||
          symbols.enums[target] ||
          symbols.classes[target] ||
          (ROBLOX_API.ready && ROBLOX_API.classes.has(target))
        ) {
          if (!symbols.locals[match[1]]) {
            symbols.locals[match[1]] = { name: match[1], type: null, detail: "Local variable" };
          }

          symbols.locals[match[1]].alias = target;
          symbols.locals[match[1]].detail = `Alias of ${target}`;
        }
      }

      const tablePattern = /\blocal\s+([A-Za-z_][A-Za-z0-9_]*)\s*=\s*\{([^{}\n]*)\}/g;

      while ((match = tablePattern.exec(source)) !== null) {
        const members = {};
        const fieldPattern = /([A-Za-z_][A-Za-z0-9_]*)\s*=/g;
        let fieldMatch;

        while ((fieldMatch = fieldPattern.exec(match[2])) !== null) {
          members[fieldMatch[1]] = {
            kind: "field",
            detail: "Local table field"
          };
        }

        if (Object.keys(members).length > 0) {
          if (!symbols.locals[match[1]]) {
            symbols.locals[match[1]] = { name: match[1], type: null, detail: "Local variable" };
          }

          symbols.locals[match[1]].tableMembers = members;
        }
      }

      for (const [name, info] of Object.entries(symbols.locals)) {
        const typeName = info.type?.replace(/\?$/, "").trim();

        if (typeName && symbols.classes[typeName]) {
          symbols.variables[name] = {
            kind: "instance",
            className: typeName
          };
        }
      }

      return symbols;
    }

    function getLauaSymbols(source) {
      return enrichLocalSymbols(source, buildLauaSymbolIndex(source));
    }

    function makeRangeFromOffsets(model, start, end) {
      const a = model.getPositionAt(start);
      const b = model.getPositionAt(end);

      return new monaco.Range(a.lineNumber, a.column, b.lineNumber, b.column);
    }


    function countIdentifierOccurrences(maskedSource, name) {
      const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const pattern = new RegExp(`\\b${escaped}\\b`, "g");
      return [...maskedSource.matchAll(pattern)].length;
    }

    function getPreferredRobloxReplacement(descriptor) {
      for (const tag of robloxTags(descriptor)) {
        if (!tag || typeof tag !== "object") continue;

        const preferred =
          tag.PreferredDescriptorName ||
          tag.PreferredDescriptor;

        if (typeof preferred === "string" && preferred.trim() !== "") {
          return preferred;
        }
      }

      return null;
    }

    function getRawRobloxMember(className, memberName, seen = new Set()) {
      if (!className || seen.has(className)) return null;

      const classInfo = ROBLOX_API.classes.get(className);
      if (!classInfo) return null;

      seen.add(className);

      for (const member of classInfo.Members || []) {
        if (member.Name === memberName) {
          return {
            member,
            ownerClass: className
          };
        }
      }

      if (classInfo.Superclass) {
        return getRawRobloxMember(classInfo.Superclass, memberName, seen);
      }

      return null;
    }

    function inferRobloxClassForOwner(owner, symbols) {
      if (owner === "game") return "DataModel";
      if (owner === "workspace") return "Workspace";

      const localInfo = symbols.locals[owner];

      if (localInfo) {
        const explicitType = localInfo.type?.replace(/\?$/, "").trim();

        if (explicitType && ROBLOX_API.classes.has(explicitType)) {
          return explicitType;
        }

        if (localInfo.robloxClass && ROBLOX_API.classes.has(localInfo.robloxClass)) {
          return localInfo.robloxClass;
        }

        if (localInfo.service && ROBLOX_API.classes.has(localInfo.service)) {
          return localInfo.service;
        }
      }

      const parameterInfo = symbols.parameters[owner];

      if (parameterInfo?.type) {
        const typeName = parameterInfo.type.replace(/\?$/, "").trim();

        if (ROBLOX_API.classes.has(typeName)) {
          return typeName;
        }
      }

      return null;
    }


    const LINT_STATEMENT_KEYWORDS = [
      "and", "break", "continue", "do", "else", "elseif", "end",
      "for", "function", "if", "in", "local", "not", "or", "repeat", "return",
      "then", "type", "until", "while",
      "class", "extends", "constructor", "private", "public", "protected",
      "static", "new", "namespace", "super", "abstract", "override", "enum",
      "final", "get", "set", "defer", "using", "async", "await",
      "match", "case", "default", "import", "from", "operator", "signal", "lazy", "watch", "export", "as",
      "lazy", "watch", "as", "export", "lazy", "watch", "export", "as",
      "lazy", "watch", "as", "export", "lazy", "watch", "export", "as",
      "lazy", "watch", "as", "export"
    ];

    function lintEditDistance(a, b) {
      const rows = a.length + 1;
      const cols = b.length + 1;
      const matrix = Array.from({ length: rows }, () => Array(cols).fill(0));

      for (let i = 0; i < rows; i++) matrix[i][0] = i;
      for (let j = 0; j < cols; j++) matrix[0][j] = j;

      for (let i = 1; i < rows; i++) {
        for (let j = 1; j < cols; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;

          matrix[i][j] = Math.min(
            matrix[i - 1][j] + 1,
            matrix[i][j - 1] + 1,
            matrix[i - 1][j - 1] + cost
          );
        }
      }

      return matrix[a.length][b.length];
    }

    function nearestLintKeyword(word) {
      let best = null;
      let bestDistance = Infinity;

      for (const keyword of LINT_STATEMENT_KEYWORDS) {
        const distance = lintEditDistance(word, keyword);

        if (distance < bestDistance) {
          bestDistance = distance;
          best = keyword;
        }
      }

      const allowedDistance = word.length >= 6 ? 2 : 1;

      return bestDistance <= allowedDistance
        ? best
        : null;
    }

    function lintLineStartOffset(line, lineOffset) {
      const firstNonWhitespace = line.search(/\S/);

      return lineOffset + (firstNonWhitespace === -1 ? 0 : firstNonWhitespace);
    }

    function lintLuauStatementSyntax(source, maskedSource, pushMarker) {
      const maskedLines = maskedSource.split("\n");
      const sourceLines = source.split("\n");
      let sourceLineIndex = 0;
      const stack = [];
      let offset = 0;

      function issue(index, length, message) {
        pushMarker(index, index + length, monaco.MarkerSeverity.Error, message, "syntax");
      }

      function push(kind, index) {
        stack.push({ kind, index });
      }

      function closeWithEnd(index) {
        if (stack.length === 0) {
          issue(index, 3, "Unexpected 'end'. There is no open block to close.");
          return;
        }

        const previous = stack[stack.length - 1];
        if (previous.kind === "repeat") {
          issue(index, 3, "A 'repeat' block must be closed with 'until', not 'end'.");
          return;
        }

        stack.pop();
      }

      function closeWithUntil(index) {
        if (!stack.length || stack[stack.length - 1].kind !== "repeat") {
          issue(index, 5, "Unexpected 'until'. It must close a 'repeat' block.");
          return;
        }

        stack.pop();
      }

      for (const line of maskedLines) {
        const rawLine = sourceLines[sourceLineIndex++] || "";
        const trimmed = line.trim();
        const firstIndex = line.search(/\S/);
        const lineStart = offset + Math.max(0, firstIndex);
        offset += line.length + 1;

        if (!trimmed || trimmed.startsWith("--!") || trimmed.startsWith("@")) continue;

        const bare = trimmed.match(/^([A-Za-z_][A-Za-z0-9_]*(?:[.:][A-Za-z_][A-Za-z0-9_]*)*)\s*;?$/);
        if (bare && !["break", "continue", "else", "end", "repeat", "do", "defer", "case", "default"].includes(bare[1])) {
          const name = bare[1].split(/[.:]/)[0];
          const guess = nearestLintKeyword(name);
          issue(lineStart, bare[1].length,
            `Unexpected standalone expression '${bare[1]}'.${guess ? ` Did you mean '${guess}'?` : ""}`);
          continue;
        }

        const head = trimmed.match(/^([A-Za-z_][A-Za-z0-9_]*)\b/);
        const first = head?.[1] || "";
        if (first && !LINT_STATEMENT_KEYWORDS.includes(first) && !trimmed.includes("=") &&
            !/^[A-Za-z_][A-Za-z0-9_.:]*\s*\(/.test(trimmed)) {
          const guess = nearestLintKeyword(first);
          if (guess) issue(lineStart, first.length, `Unknown statement '${first}'. Did you mean '${guess}'?`);
        }

        const events = [];
        function add(kind, relativeIndex, length = kind.length) {
          events.push({ kind, index: offset - line.length - 1 + relativeIndex, relativeIndex, length });
        }

        const headerIndex = Math.max(0, firstIndex);
        // Header blocks are counted once, even when their 'then' or 'do' is on
        // the same line. End tokens below can close them on that same line.
        if (/^if\b/.test(trimmed)) {
          if (!/\bthen\b/.test(trimmed)) issue(lineStart, trimmed.length, "'if' statement is missing 'then'.");

      monaco.languages.registerInlineCompletionsProvider("laua", {
        async provideInlineCompletions(model, position) {
          const line = model.getLineContent(position.lineNumber);
          const before = line.slice(0, position.column - 1);
          const symbols = getProjectSymbols(model);
          const cursorOffset = model.getOffsetAt(position);

          const makeItem = (startColumn, text) => ({
            insertText: text,
            range: new monaco.Range(
              position.lineNumber,
              startColumn,
              position.lineNumber,
              position.column
            )
          });

          const attributeInline = before.match(/@([A-Za-z_][A-Za-z0-9_]*)$/);

          if (attributeInline && attributeInline[1].length >= 2) {
            const partial = attributeInline[1];
            const matches = LUAU_ATTRIBUTES.filter(attribute =>
              attribute.slice(1).toLowerCase().startsWith(partial.toLowerCase()) &&
              attribute.slice(1).toLowerCase() !== partial.toLowerCase()
            );

            if (matches.length === 1) {
              return {
                items: [makeItem(position.column - partial.length, matches[0].slice(1))]
              };
            }
          }

          const directiveInline = before.match(/--!([A-Za-z_][A-Za-z0-9_]*)$/);

          if (directiveInline && directiveInline[1].length >= 2) {
            const partial = directiveInline[1];
            const matches = LUAU_DIRECTIVES.filter(directive =>
              directive.slice(3).toLowerCase().startsWith(partial.toLowerCase()) &&
              directive.slice(3).toLowerCase() !== partial.toLowerCase()
            );

            if (matches.length === 1) {
              return {
                items: [makeItem(position.column - partial.length, matches[0].slice(3))]
              };
            }
          }

          const memberMatch = before.match(/([A-Za-z_][A-Za-z0-9_]*)\s*([.:])\s*([A-Za-z_][A-Za-z0-9_]*)$/);

          if (memberMatch) {
            const owner = memberMatch[1];
            const operator = memberMatch[2];
            const partial = memberMatch[3];

            if (partial.length >= 2) {
              if ((owner === "game" || owner === "workspace") && !ROBLOX_API.ready) {
                await ensureRobloxApiLoaded();
              }

              const members = getSymbolMembers(symbols, owner, operator, cursorOffset);

              if (members) {
                const matches = Object.keys(members).filter(name =>
                  name.toLowerCase().startsWith(partial.toLowerCase()) &&
                  name.toLowerCase() !== partial.toLowerCase()
                );

                if (matches.length === 1) {
                  const member = matches[0];
                  return { items: [makeItem(position.column - partial.length, member)] };
                }
              }
            }
          }

          const newMatch = before.match(/\bnew\s+([A-Za-z_][A-Za-z0-9_]*)$/);

          if (newMatch && newMatch[1].length >= 2) {
            const partial = newMatch[1];
            const matches = Object.keys(symbols.classes).filter(name =>
              name.toLowerCase().startsWith(partial.toLowerCase()) &&
              name.toLowerCase() !== partial.toLowerCase()
            );

            if (matches.length === 1) {
              return { items: [makeItem(position.column - partial.length, matches[0])] };
            }
          }

          return { items: [] };
        },

        freeInlineCompletions() {}

      monaco.languages.registerHoverProvider("laua", {
        provideHover(model, position) {
          const wordInfo = model.getWordAtPosition(position);
          if (!wordInfo) return null;

          const word = wordInfo.word;
          const symbols = getLauaSymbols(model.getValue());
          const contents = [];

          const lineText = model.getLineContent(position.lineNumber);
          const cursorIndex = position.column - 1;

          const attributeOccurrences = [...lineText.matchAll(/@[A-Za-z_][A-Za-z0-9_]*/g)];

          for (const occurrence of attributeOccurrences) {
            const attribute = occurrence[0];
            const index = occurrence.index;

            if (
              cursorIndex >= index &&
              cursorIndex <= index + attribute.length &&
              LUAU_SPECIAL_DOCS[attribute]
            ) {
              return {
                range: new monaco.Range(
                  position.lineNumber,
                  index + 1,
                  position.lineNumber,
                  index + attribute.length + 1
                ),
                contents: [
                  { value: `**Luau attribute \`${attribute}\`**` },
                  { value: LUAU_SPECIAL_DOCS[attribute] }
                ]
              };
            }
          }

          const directiveOccurrence = lineText.match(/--!(?:strict|nonstrict|nocheck|native|nolint|optimize)\\b/);

          if (directiveOccurrence) {
            const directive = directiveOccurrence[0];
            const index = directiveOccurrence.index;

            if (
              cursorIndex >= index &&
              cursorIndex <= index + directive.length &&
              LUAU_SPECIAL_DOCS[directive]
            ) {
              return {
                range: new monaco.Range(
                  position.lineNumber,
                  index + 1,
                  position.lineNumber,
                  index + directive.length + 1
                ),
                contents: [
                  { value: `**Luau directive \`${directive}\`**` },
                  { value: LUAU_SPECIAL_DOCS[directive] }
                ]
              };
            }
          }

          if (LAUA_DOCS[word]) {
            contents.push({ value: `**Laua keyword \`${word}\`**` });
            contents.push({ value: LAUA_DOCS[word] });
          } else if (symbols.classes[word]) {
            const info = symbols.classes[word];
            contents.push({
              value: `**class \`${word}\`${info.base ? ` extends \`${info.base}\`` : ""}**`
            });

            const instanceCount = Object.keys(info.instanceMembers).length;
            const staticCount = Object.keys(info.staticMembers).length;
            contents.push({ value: `${instanceCount} instance member(s), ${staticCount} static member(s).` });
          } else if (symbols.namespaces[word]) {
            const count = Object.keys(symbols.namespaces[word].members).length;
            contents.push({ value: `**namespace \`${word}\`**` });
            contents.push({ value: `${count} exported member(s).` });
          } else if (symbols.enums[word]) {
            const members = Object.keys(symbols.enums[word].members);
            contents.push({ value: `**enum \`${word}\`**` });
            contents.push({ value: members.length ? members.map(x => `\`${x}\``).join(", ") : "No members." });
          } else if (symbols.locals[word]) {
            contents.push({ value: `**local \`${word}\`**` });
            contents.push({ value: symbols.locals[word].detail || "Local variable." });
          } else if (symbols.localFunctions[word]) {
            const fn = symbols.localFunctions[word];
            contents.push({ value: `**function \`${word}(${fn.params || ""})\`**` });
          } else if (symbols.parameters[word]) {
            contents.push({ value: `**parameter \`${word}\`**` });
            contents.push({ value: symbols.parameters[word].detail || "Function parameter." });
          }

          if (contents.length === 0) return null;

          return {
            range: new monaco.Range(
              position.lineNumber,
              wordInfo.startColumn,
              position.lineNumber,
              wordInfo.endColumn
            ),
            contents
          };
        }
      });

      function normalizeProjectFilename(input) {
        let name = String(input || "").trim().replace(/\\/g, "/");
        name = name.replace(/^\/+/, "");
        if (!name.endsWith(".laua")) name += ".laua";
        const pieces = name.split("/");
        if (pieces.some(part => part === ".." || part === "." || !/^[A-Za-z_][A-Za-z0-9_]*\.laua$/.test(part) && !/^[A-Za-z_][A-Za-z0-9_]*$/.test(part))) {

      function resolveProjectImport(fromFile, importPath) {
        if (!/^(?:\.\/|\.\.\/)/.test(importPath)) return null;
        const base = fromFile.split("/").slice(0, -1);
        for (const part of importPath.replace(/\\/g, "/").split("/")) {
          if (!part || part === ".") continue;
          if (part === "..") {
            if (!base.length) return null;
            base.pop();
          } else {
            if (!/^[A-Za-z_][A-Za-z0-9_]*(?:\.laua)?$/.test(part)) return null;
            base.push(part);
          }
        }
        const target = base.join("/");
        return target.endsWith(".laua") ? target : target + ".laua";

          const match = code.match(/^\s*import\s+(?:([A-Za-z_]\w*)|\{([^{}]+)\})\s+from\s+["']([^"'\n]+)["']\s*$/);
          if (!match) continue; // ordinary parser/linter handles malformed imports
          imports.push({name:match[1],named:match[2],path:match[3],target:resolveProjectImport(fileName,match[3]),line:row + 1});
        }
        return imports;
      }

      function scanProjectExports(source) {
        const exports = {};
        const pattern = /^\s*export\s+(?:(?:final|abstract)\s+)?(class|namespace|enum|(?:local\s+)?(?:async\s+)?function|local)\s+([A-Za-z_]\w*)/gm;
        for (const m of source.matchAll(pattern)) {
          const rawKind = m[1];
          const kind = rawKind.endsWith("function") ? "function" : rawKind === "local" ? "field" : rawKind;
          exports[m[2]] = {kind, name:m[2]};
        }
        return exports;
      }

      function getProjectSymbols(model) {
        const current = findFileByModel(model);
        const localSymbols = getLauaSymbols(model.getValue());
        if (!current) return localSymbols;
        for (const imp of scanProjectImports(current.name, model.getValue())) {
          const imported = imp.target && projectFiles.get(imp.target);
          if (!imported) continue;
          const exports = scanProjectExports(imported.model.getValue());
          let remoteSymbols = null;
          try {
            // The original symbol scanner recognizes `class X` but not
            // `export class X`. Strip only the export prefix for indexing.
            const indexedSource = imported.model.getValue().replace(/^(\s*)export\s+(?=(?:abstract\s+|final\s+)?(?:class|enum|namespace|(?:local\s+)?(?:async\s+)?function|local)\b)/gm, "$1");
            remoteSymbols = getLauaSymbols(indexedSource);
          } catch { continue; }
          if (imp.name) {
            localSymbols.namespaces[imp.name] = {
              name:imp.name, start:0, end:0,
              members:Object.fromEntries(Object.entries(exports).map(([key,value]) => [key, {kind:value.kind === "function" ? "function" : "field", detail:`Export from ${imp.target}`}]))
            };
          }
          if (imp.named) {
            for (const clause of imp.named.split(",")) {
              const named = clause.trim().match(/^([A-Za-z_]\w*)(?:\s+as\s+([A-Za-z_]\w*))?$/);
              if (!named || !exports[named[1]]) continue;
              const original = named[1], alias = named[2] || named[1];
              const info = exports[original];
              if (info.kind === "class" && remoteSymbols.classes[original]) {
                if (!localSymbols.classes[alias]) localSymbols.classes[alias] = {...remoteSymbols.classes[original], name:alias, start:-1, end:-1};
              } else if (info.kind === "namespace" && remoteSymbols.namespaces[original]) {
                if (!localSymbols.namespaces[alias]) localSymbols.namespaces[alias] = {...remoteSymbols.namespaces[original], name:alias, start:-1, end:-1};
              } else if (info.kind === "enum" && remoteSymbols.enums[original]) {
                if (!localSymbols.enums[alias]) localSymbols.enums[alias] = {...remoteSymbols.enums[original], name:alias, start:-1, end:-1};
              } else if (info.kind === "function") {
                localSymbols.localFunctions[alias] = remoteSymbols.localFunctions[original] || {name:alias,params:"",detail:`Import from ${imp.target}`};
              } else {
                localSymbols.locals[alias] = {name:alias,detail:`Import from ${imp.target}`};
              }
            }
          }
        }
        return localSymbols;
      }

      function findFileByModel(model) {
        if (!model) return null;
        for (const file of projectFiles.values()) if (file.model === model) return file;
        return null;
      }

      function projectImportMarkers(file) {
        const markers = [];
        for (const imp of scanProjectImports(file.name,file.model.getValue())) {
          const targetFile = imp.target && projectFiles.get(imp.target);
          let message = null;
          if (!imp.target) message = `Invalid project import '${imp.path}'.`;
          else if (!targetFile) message = `Missing project file '${imp.target}' (imported as ${imp.path}).`;
          else if (imp.named) {
            const exports = scanProjectExports(targetFile.model.getValue());
            for (const part of imp.named.split(",")) {
              const name = part.trim().match(/^([A-Za-z_]\w*)/);
              if (name && !exports[name[1]]) {
                message = `'${name[1]}' is not exported from ${imp.target}.`;
                break;
              }
            }
          }
          if (message) markers.push({severity:monaco.MarkerSeverity.Error, startLineNumber:imp.line, endLineNumber:imp.line, startColumn:1, endColumn:Math.max(2,file.model.getLineMaxColumn(imp.line)), message, source:"Laua project"});
        }
        return markers;
      }

      function refreshFileMarkers(file) {
        const result = updateLauaDiagnostics(file.model);
        const base = monaco.editor.getModelMarkers({owner:"laua",resource:file.model.uri}) || [];
        const projectErrors = projectImportMarkers(file);
        monaco.editor.setModelMarkers(file.model,"laua-project",projectErrors);
        file.errors = (result?.errors || 0) + projectErrors.length;
        file.warnings = result?.warnings || 0;
        return {errors:file.errors, warnings:file.warnings, hints:result?.hints || 0, directives:result?.directives};
      }

      function lintAllProjectFiles() {
        let errors=0, warnings=0;
        for (const file of projectFiles.values()) {
          const res=refreshFileMarkers(file);
          errors+=res.errors;
          warnings+=res.warnings;
        }
        renderProjectTabs();
        return {errors,warnings};
      }

      function rememberProject() {
        if (!projectReady) return;
        try {
          const value = {active:activeFile,files:[...projectFiles.values()].map(f=>({name:f.name,source:f.model.getValue()}))};
          localStorage.setItem(PROJECT_KEY,JSON.stringify(value));
        } catch (error) {
          // Storage can be disabled in private or file:// contexts. Editing still works.
          console.warn("Laua project autosave unavailable:",error);
        }
      }

      function restoredProject() {
        try {
          const rawSaved=localStorage.getItem(PROJECT_KEY);
          const saved=JSON.parse(rawSaved || "null");
          if (!saved || !Array.isArray(saved.files) || !saved.files.length || saved.files.length > 100) return null;
          const seen=new Set(), safe=[];
          for (const entry of saved.files) {
            if (!entry || typeof entry.name !== "string" || typeof entry.source !== "string") return null;
            const name=normalizeProjectFilename(entry.name);
            if (seen.has(name)) return null;
            seen.add(name);
            // The old demo or a blank main file should never result in an empty
            // startup editor. Keep an exact recovery copy of the old project.
            const oldDemo = name === "main.laua" && entry.source === PREVIOUS_MAIN_STARTER;
            const blankMain = name === "main.laua" && entry.source.trim() === "";
            if (blankMain || oldDemo) {
              try {
                if (!localStorage.getItem(RECOVERY_KEY)) {
                  localStorage.setItem(RECOVERY_KEY, JSON.stringify(saved));
                }
              } catch {}
            }
            safe.push({name,source:(blankMain || oldDemo) ? STARTER : entry.source});
          }
          // A deleted main.laua must not make the next visit open Zombie.laua.
          if (!seen.has("main.laua")) {
            safe.unshift({name:"main.laua",source:STARTER});
          }
          // A tab selected last visit should NOT decide what opens next visit.
          // Its source is kept intact and the user can select the tab again.
          return {files:safe,active:"main.laua"};
        } catch (error) {
          try {
            const original=localStorage.getItem(PROJECT_KEY);
            if (original && !localStorage.getItem(RECOVERY_KEY)) localStorage.setItem(RECOVERY_KEY, original);
          } catch {}
          console.warn("Saved Laua project could not be restored:", error);
          return null;
        }
      }

      function createProjectFile(name,source="", options={}) {
        const normalized=normalizeProjectFilename(name);
        if (projectFiles.has(normalized)) throw new Error(`'${normalized}' already exists.`);
        const uri=monaco.Uri.parse(`inmemory://laua/${normalized}`);
        const model=monaco.editor.createModel(source,"laua",uri);
        const output=monaco.editor.createModel("","lua",monaco.Uri.parse(`inmemory://laua-output/${removeLauaExtension(normalized)}.luau`));
        const file={name:normalized,model,output,sourceView:null,outputView:null,errors:0,warnings:0,generated:null};
        file.disposeChange=model.onDidChangeContent(()=>{
          file.generated=null;
          file.output.setValue("");
          if (activeFile === file.name) {
            lastSuccessfulLuau=null;
            priorSuccessfulLuau=null;
          }
          rememberProject();
          refreshEditorIntelligence();
        });
        projectFiles.set(normalized,file);
        if (!options.silent) { switchProjectFile(normalized); rememberProject(); }
        return file;
      }

      function switchProjectFile(name) {
        const next=projectFiles.get(name);
        if (!next) throw new Error(`Missing file '${name}'.`);
        if (activeFile && projectFiles.has(activeFile)) {
          const previous=projectFiles.get(activeFile);
          previous.sourceView=lauaEditor.saveViewState();
          previous.outputView=luauEditor.saveViewState();
        }
        activeFile=name;
        lauaEditor.setModel(next.model);
        luauEditor.setModel(next.output);
        if (next.sourceView) lauaEditor.restoreViewState(next.sourceView);
        if (next.outputView) luauEditor.restoreViewState(next.outputView);
        document.getElementById("outputFilename").textContent=removeLauaExtension(name)+".luau · read only";
        lastSuccessfulLuau=next.generated;
        priorSuccessfulLuau=null;
        renderProjectTabs();
        refreshEditorIntelligence();
        rememberProject();
        // Each tab has an independent output model; populate it when the
        // user switches tabs instead of leaving the right-hand pane blank.
        if (playgroundInitialized) runTranspile();
      }

      function renderProjectTabs() {
        projectTabBar.replaceChildren();
        for (const file of projectFiles.values()) {
          const tab=document.createElement("button");
          tab.type="button";
          tab.className="file-tab"+(file.name===activeFile?" active":"");
          tab.setAttribute("role","tab");
          tab.setAttribute("aria-selected",file.name===activeFile?"true":"false");
          tab.title=file.name;
          const label=document.createElement("span");label.textContent=file.name;
          tab.appendChild(label);
          if (file.errors) { const indicator=document.createElement("span");indicator.className="file-error";indicator.textContent=`${file.errors}!`;tab.appendChild(indicator); }
          const close=document.createElement("span");
          close.className="file-close";close.setAttribute("aria-label",`Close ${file.name}`);close.textContent="×";
          close.setAttribute("role","button");close.setAttribute("tabindex","0");
          close.addEventListener("click", event=>{event.stopPropagation();deleteProjectFile(file.name);});
          close.addEventListener("keydown",event=>{if(event.key==="Enter" || event.key===" "){event.preventDefault();event.stopPropagation();deleteProjectFile(file.name);}});
          tab.appendChild(close);
          tab.addEventListener("click",()=>switchProjectFile(file.name));
          projectTabBar.appendChild(tab);
        }
      }

      function deleteProjectFile(name) {
        if (!projectFiles.has(name)) return;
        if (projectFiles.size===1) { projectStatus().textContent="You must keep at least one Laua file. Use Clear to empty it.";return; }
        if (!confirm(`Close and delete '${name}' from this browser project?`)) return;
        const files=[...projectFiles.keys()],index=files.indexOf(name);
        const file=projectFiles.get(name);
        projectFiles.delete(name);
        file.disposeChange.dispose();
        if (activeFile===name) {activeFile=null; switchProjectFile(files[index+1] && projectFiles.has(files[index+1])?files[index+1]:files[index-1]);}
        file.model.dispose();file.output.dispose();
        rememberProject();lintAllProjectFiles();renderProjectTabs();
      }

      function projectRelativePath(fromFile,toFile) {
        const folder=fromFile.split("/").slice(0,-1);
        const target=removeLauaExtension(toFile).split("/");
        while(folder.length && target.length && folder[0]===target[0]) {folder.shift();target.shift();}
        const path=[...folder.map(()=>".."),...target].join("/");
        return path.startsWith(".") ? path : "./"+path;
      }

      function updateProjectImportPaths(oldName,newName) {
        for (const file of projectFiles.values()) {
          if(file.name===newName) continue;
          const lines=file.model.getValue().split("\n");
          let changed=false;
          for(const imp of scanProjectImports(file.name,file.model.getValue())) {
            if(imp.target!==oldName) continue;
            const updated=projectRelativePath(file.name,newName);
            // Only alter the path of a valid import declaration.
            const line=lines[imp.line-1];
            lines[imp.line-1]=line.replace(/(\bfrom\s+)(["'])([^"'\n]+)\2\s*$/,(_full,prefix,quote)=>`${prefix}${quote}${updated}${quote}`);
            changed=changed || lines[imp.line-1]!==line;
          }
          if(changed)file.model.setValue(lines.join("\n"));
        }
      }

      function renameProjectFile(previous,desired) {
        const nextName=normalizeProjectFilename(desired);
        if (nextName===previous) return;
        if (projectFiles.has(nextName)) throw new Error(`'${nextName}' already exists.`);
        const original=projectFiles.get(previous);
        if (!original) return;
        // Monaco model URIs cannot be renamed. Create a new file and switch to it.
        const replacement=createProjectFile(nextName,original.model.getValue(),{silent:true});
        replacement.output.setValue(original.output.getValue());
        replacement.generated=original.generated;
        projectFiles.delete(previous);
        updateProjectImportPaths(previous,nextName);
        original.disposeChange.dispose();
        original.model.dispose();original.output.dispose();
        if (activeFile===previous) { activeFile=null; switchProjectFile(nextName); }
        rememberProject();lintAllProjectFiles();renderProjectTabs();
      }

      function compileProjectFiles() {
        const result=[];
        const failures=[];
        for (const file of projectFiles.values()) {
          const extra=projectImportMarkers(file);
          if (extra.length) { failures.push(`${file.name}: ${extra.map(m=>m.message).join("; ")}`);continue; }
          try {
            const output=transpile(file.model.getValue(),{Mode:modeSelection()});
            result.push({sourceName:file.name,source:file.model.getValue(),outputName:removeLauaExtension(file.name)+".luau",output});
          } catch (error) {failures.push(`${file.name}: ${error?.message || String(error)}`);}
        }
        if (failures.length) throw new Error(`Project export stopped: ${failures.join(" | ")}`);
        return result;
      }

      // Small ZIP writer: uncompressed ZIP entries, CRC-32, UTF-8 filenames.
      // Runs entirely in the page: no extra JavaScript dependency or runtime modules.
      function makeProjectZip(files) {
        const utf8=new TextEncoder();
        const crcTable=new Uint32Array(256);
        for(let i=0;i<256;i++) {
          let crc=i;
          for(let j=0;j<8;j++) crc=(crc & 1)?(0xedb88320^(crc>>>1)):(crc>>>1);
          crcTable[i]=crc>>>0;
        }
        function crc32(bytes) {let crc=0xffffffff;for(const byte of bytes)crc=crcTable[(crc^byte)&255]^(crc>>>8);return (crc^0xffffffff)>>>0;}
        function u16(buffer,offset,v){buffer.setUint16(offset,v,true);}
        function u32(buffer,offset,v){buffer.setUint32(offset,v>>>0,true);}
        const blocks=[],central=[];
        let offset=0;
        for(const entry of files) {
          const filename=utf8.encode(entry.name),data=utf8.encode(entry.content);
          if(filename.length>65535 || data.length>0xffffffff) throw new Error("Project file too large for ZIP export.");
          const crc=crc32(data),length=30+filename.length+data.length;
          const local=new Uint8Array(length),view=new DataView(local.buffer);
          u32(view,0,0x04034b50);u16(view,4,20);u16(view,6,0x0800);u16(view,8,0);
          u32(view,14,crc);u32(view,18,data.length);u32(view,22,data.length);u16(view,26,filename.length);
          local.set(filename,30);local.set(data,30+filename.length);blocks.push(local);
          const record=new Uint8Array(46+filename.length),c=new DataView(record.buffer);
          u32(c,0,0x02014b50);u16(c,4,20);u16(c,6,20);u16(c,8,0x0800);
          u32(c,16,crc);u32(c,20,data.length);u32(c,24,data.length);u16(c,28,filename.length);u32(c,42,offset);
          record.set(filename,46);central.push(record);offset+=length;
        }
        if(central.length>65535)throw new Error("Too many files for ZIP export.");
        const directorySize=central.reduce((a,b)=>a+b.length,0),eocd=new Uint8Array(22),end=new DataView(eocd.buffer);
        u32(end,0,0x06054b50);u16(end,8,central.length);u16(end,10,central.length);
        u32(end,12,directorySize);u32(end,16,offset);
        return new Blob([...blocks,...central,eocd],{type:"application/zip"});
      }

      function downloadProjectBlob(filename,blob) {
        const link=document.createElement("a");const url=URL.createObjectURL(blob);
        link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
      }

      async function exportProject() {

          projectStatus().textContent=`Exported ${all.length} Laua files + ${all.length} Luau outputs.`;

        } catch(error) {

          projectStatus().className="error";
        }
      }

      function runTranspilerSelfTests() {
        const tests = [
          {
            name: "new without args",
            source: "class myClass\nend\nlocal thing = new myClass",
            expected: "local thing = myClass.new()"
          },
          {
            name: "new with args",
            source: "class myClass\n\tconstructor(value)\n\t\tself.Value = value\n\tend\nend\nlocal thing = new myClass(5)",
            expected: "local thing = myClass.new(5)"
          },
          {
            name: "final class",
            source: "final class Locked\nend\nclass Derived extends Locked\nend",
            expected: "Cannot extend final class"
          },
          {
            name: "get setter",
            source: "class Player\n get Score()\n return 4\n end\n set Score(value)\n print(value)\n end\nend",
            expected: "Player.__getters.Score = function(self)"
          },
          {
            name: "defer scope",
            source: "local function demo()\n defer\n print(1)\n end\n return 5\nend",
            expected: "table.pack(xpcall(function()"
          },
          {
            name: "async and await",
            source: "async function Fetch()\n    return await Get()\nend",
            expected: "return __lauaAsync.run(function()"
          },
          {
            name: "using cleanup",
            source: "local function Work()\n    using conn = event:Connect(handler)\nend",
            expected: "conn:Disconnect()"
          },
          {
            name: "async method",
            source: "class Client\n    async function Run()\n        return await Get()\n    end\nend",
            expected: "function Client:Run()"
          },
          { name: "class check", source: "class A\nend\nlocal a = new A\nprint(a is A)", expected: "__lauaCore.is(a, A)" },
          { name: "pipeline", source: "local out = 5 |> Double |> tostring", expected: "tostring(Double(5))" },
          { name: "memo function", source: "memo function Twice(a)\n return a * 2\nend", expected: "Twice = __lauaCore.memo(Twice)" },
          { name: "optional index", source: "local value = data?.[index]", expected: "__lauaCore.optionalIndex(data, function() return index end)" },
          { name: "default argument", source: "function F(a = 10)\n return a\nend", expected: "if a == nil then a = 10 end" },
          {
            name: "normal Luau .new",
            source: "local part = Instance.new(\"Part\")",
            expected: "Instance.new(\"Part\")"
          }
        ];

        for (const test of tests) {
          const output = transpile(test.source);

          if (!output.includes(test.expected)) {
            throw new Error(`Self-test failed: ${test.name}`);
          }
        }

        return true;
      }

      function runLint(showStatus = true) {
